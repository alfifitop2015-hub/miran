<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="zh-icon-192.png">
<link rel="apple-touch-icon" href="zh-icon-180.png">
<meta name="apple-mobile-web-app-title" content="ني هاو">
<meta name="application-name" content="ني هاو">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ني هاو</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;700&display=swap">
<style>
/* Layout: same as مِران's voice conversation — scenario list, then a chat run with one large microphone under the bubbles. */
:root{
  --paper:#FFF2F7;--card:#FFFFFF;--ink:#3A1430;--muted:#7A5270;--line:#F6DCE8;
  --chalk:#F5B82E;--ok:#16A36A;--okbg:#DDF7EA;--bad:#E5484D;--badbg:#FDE5E6;
  --acc:#C2185B;--pink:#9C5BD9;--onacc:#FFFFFF;
  --fd:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --fb:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fz:"Noto Sans SC","PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--paper:#1D0E1B;--card:#2A1527;--ink:#FBEAF3;--muted:#C9A3BC;--line:#4A2442;--chalk:#FFCB5C;--ok:#4FD69A;--okbg:#123427;--bad:#FF7A7E;--badbg:#3C1A22;--acc:#FF8AC0;--pink:#C79BFF;--onacc:#2A0B1F}
}
:root[data-theme="dark"]{color-scheme:dark;--paper:#1D0E1B;--card:#2A1527;--ink:#FBEAF3;--muted:#C9A3BC;--line:#4A2442;--chalk:#FFCB5C;--ok:#4FD69A;--okbg:#123427;--bad:#FF7A7E;--badbg:#3C1A22;--acc:#FF8AC0;--pink:#C79BFF;--onacc:#2A0B1F}

*{box-sizing:border-box}
body{--accsoft:color-mix(in srgb,var(--acc) 13%,var(--card));--acc2:color-mix(in srgb,var(--acc) 62%,var(--pink));
  background:var(--paper);background-image:radial-gradient(900px 420px at 100% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),radial-gradient(700px 380px at -10% 0%,color-mix(in srgb,var(--pink) 10%,transparent),transparent 70%);background-repeat:no-repeat;
  color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 14px}
.brand{font-family:var(--fd);font-weight:800;font-size:28px;line-height:1.2;background:linear-gradient(135deg,var(--acc),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.band{border-radius:20px;padding:20px;color:var(--onacc);background:linear-gradient(135deg,var(--acc),var(--acc2));position:relative;overflow:hidden;box-shadow:0 12px 30px -16px var(--acc);display:flex;align-items:center;gap:16px}
.band::after{content:"";position:absolute;inset-inline-end:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:color-mix(in srgb,var(--onacc) 14%,transparent)}
.band h1,.band .sub,.tcmic{position:relative}
.band .sub{color:inherit;opacity:.92}
.tcmic{width:64px;height:64px;border-radius:50%;background:color-mix(in srgb,var(--onacc) 22%,transparent);display:grid;place-items:center;flex:none}.tcmic svg{width:32px;height:32px}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:26px;font-weight:800}h2{font-size:21px;font-weight:700}h3{font-size:17px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 18px -12px color-mix(in srgb,var(--acc) 40%,transparent)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--acc);transform:translateY(-1px)}
.tile h3{color:var(--acc);margin-bottom:2px}
.tile .meta{font-size:13px;color:var(--muted)}
.tile .go{font-size:28px;color:var(--acc);line-height:1;flex:none}
.zh{font-family:var(--fz);unicode-bidi:isolate;direction:ltr}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600}
.seg button.on{border-color:var(--acc);background:var(--accsoft);color:var(--acc)}
.lbl{font-weight:600;font-size:14px}.lbl small{font-weight:400;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:12px 18px;font-weight:700;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);box-shadow:0 6px 16px -8px var(--acc);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.plain{background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.wide{width:100%}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.prog{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;margin:0}
.note{font-size:13px;color:var(--muted);margin:0;text-align:center}
.big{font-family:var(--fd);font-size:52px;font-weight:800;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums}
.x{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:14px}
input[type=text]{padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;font-family:var(--fz),var(--fb);font-size:18px}
input::placeholder{font-family:var(--fb);font-size:15px}

.chat{display:flex;flex-direction:column;gap:10px;direction:ltr}
.bub{max-width:86%;padding:10px 14px;border-radius:18px;line-height:1.55;overflow-wrap:anywhere}
.bub.bot{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;font-family:var(--fz);font-size:22px}
.bub.me{align-self:flex-end;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);border-bottom-right-radius:6px;font-family:var(--fz);font-size:20px}
.bub.sys{align-self:stretch;max-width:100%;direction:var(--dir);text-align:start;background:var(--badbg);border-radius:14px;font-size:15px}
.bub.sys.ok{background:var(--okbg)}
.py{font-family:"Segoe UI","Noto Sans",system-ui,sans-serif;font-size:14px;color:var(--acc);direction:ltr;text-align:left}
.bubtools{display:flex;gap:6px;margin-top:6px;direction:var(--dir);justify-content:flex-end}
.bubtools .x{font-size:12px;padding:4px 10px;display:inline-flex;align-items:center;gap:4px;font-family:var(--fb)}
.x svg{width:14px;height:14px}
.bubar{direction:var(--dir);text-align:start;font-family:var(--fb);font-size:14px;color:var(--muted);margin-top:4px}
.bub.sys .x{margin-top:6px;display:inline-flex;align-items:center;gap:4px}
.tknote{margin-top:6px;font-size:14px;unicode-bidi:plaintext}
.tkmodel{font-family:var(--fz);font-size:20px;font-weight:500;margin:6px 0 0;text-align:left;direction:ltr}
.tkctl{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.mic{width:86px;height:86px;border-radius:50%;border:none;display:grid;place-items:center;color:var(--onacc);background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 24px -10px var(--acc)}
.mic svg{width:38px;height:38px}.mic.on{background:var(--bad)}
.tklive{min-height:1.6em;font-family:var(--fz);font-size:19px;color:var(--muted);text-align:center}
.wait{align-self:flex-start;display:flex;gap:5px;padding:14px}
.wait i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:dot 1.1s infinite}
.wait i:nth-child(2){animation-delay:.18s}.wait i:nth-child(3){animation-delay:.36s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
@media (prefers-reduced-motion:no-preference){
  .pop{animation:pop .25s ease}@keyframes pop{from{transform:scale(.97);opacity:.6}to{transform:none;opacity:1}}
  .mic.on{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 16px transparent}}
}
@media (prefers-reduced-motion:reduce){.wait i{animation:none}}
input[type=email],input[type=password]{padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;font-size:16px}
input.ar{font-family:var(--fb);font-size:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.warn{background:var(--badbg);border-radius:12px;padding:12px;font-size:14px}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accsoft);color:var(--acc);font-weight:600}
.bub.sys .chip{background:var(--card);color:var(--ok);margin-inline-start:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats.three{grid-template-columns:1fr 1fr 1fr}.stats.three .stat{padding:10px 8px}.stats.three .stat span{font-size:12.5px}
.stgbox{display:flex;flex-direction:column;gap:8px;background:var(--accsoft);border-radius:14px;padding:12px}
.stg{font-weight:700;font-size:15px}.stgbox .bar{height:8px;background:color-mix(in srgb,var(--acc) 15%,var(--card))}
.chal{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:linear-gradient(135deg,#FFE6F1,#F0E3FF);border:1.5px solid #F3B6D3;color:#4A1238}
.chal .meta{color:#7A3A64;font-size:13px}.chal h3{margin:2px 0}
.x2{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:999px;background:#D3202A;color:#fff;vertical-align:middle}
.chtile{border-color:#E0559B}
/* تدرّج لون واحد حسب الصعوبة: فاتح ← متوسط ← غامق */
:root{--lv1:#FDE8F2;--lv1b:#F8C8DE;--lv1t:#A3165A;--lv2:#F5A3CA;--lv2b:#EE7FB4;--lv2t:#5C0C34;--lv3:#B0185E;--lv3b:#8E104B;--lv3t:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--lv1:#3A1733;--lv1b:#55244B;--lv1t:#FF9CCB;--lv2:#7A1F5C;--lv2b:#953171;--lv2t:#FDE8F2;--lv3:#E0559B;--lv3b:#EC76B1;--lv3t:#FFFFFF}}
:root[data-theme="dark"]{--lv1:#3A1733;--lv1b:#55244B;--lv1t:#FF9CCB;--lv2:#7A1F5C;--lv2b:#953171;--lv2t:#FDE8F2;--lv3:#E0559B;--lv3b:#EC76B1;--lv3t:#FFFFFF}
.tile.lv1{background:var(--lv1);border-color:var(--lv1b)}.tile.lv2{background:var(--lv2);border-color:var(--lv2b)}.tile.lv3{background:var(--lv3);border-color:var(--lv3b)}
.tile.lv1 h3,.tile.lv1 .go{color:var(--lv1t)}.tile.lv2 h3,.tile.lv2 .go{color:var(--lv2t)}.tile.lv3 h3,.tile.lv3 .go,.tile.lv3 .meta{color:var(--lv3t)}
.tile.lv2 .meta{color:var(--lv2t);opacity:.85}.tile.lv3 .meta{opacity:.85}
.lvh{display:flex;align-items:center;gap:8px}.lvh i{width:14px;height:14px;border-radius:4px;flex:none}
.lvh1 i{background:var(--lv1b)}.lvh2 i{background:var(--lv2b)}.lvh3 i{background:var(--lv3)}
.medal{font-size:30px;line-height:1}
.lesson summary{cursor:pointer;font-weight:700}.ltxt{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.lline{display:flex;align-items:center;gap:6px;font-family:var(--fz);font-size:17px;line-height:1.5}.lline span{flex:1}.lline b{color:var(--acc);white-space:nowrap}.lline .x{padding:4px 8px;flex:none}
.semh{font-size:17px;color:var(--acc);border-bottom:2px solid var(--line);padding-bottom:4px;margin-top:6px}
.certimg img{width:100%;height:auto;border-radius:10px;box-shadow:0 4px 18px rgba(0,0,0,.15);display:block}
.okbox{background:var(--okbg);color:var(--ok);font-weight:700;border-radius:12px;padding:10px 12px}
.btn.danger{background:var(--bad)}
.stat{background:var(--accsoft);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-family:var(--fd);font-size:24px;line-height:1.2;color:var(--acc);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.brd{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.brd:last-child{border-bottom:none}.brd.me{background:var(--accsoft);border-radius:10px;padding-inline:8px;border-bottom-color:transparent}
.brd .n{font-family:var(--fd);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.brd .sc{font-family:var(--fd);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.brd .nm{min-width:0;overflow-wrap:anywhere}
.tier{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--chalk);white-space:nowrap}
.li{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:none}.li .grow{overflow-wrap:break-word;word-break:normal}
.li>.grow{flex:1 1 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0}
.li>.grow b{white-space:normal}.li .kindsel{flex:0 0 auto;width:auto;min-width:96px}
.x.ok{border-color:var(--ok);color:var(--ok)}.x.bad{border-color:var(--bad);color:var(--bad)}
.foot{display:flex;justify-content:center;margin-top:6px}
.ivcard{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:none;border-radius:18px;padding:12px 16px;background:linear-gradient(135deg,#5A1248,#7E2468);box-shadow:0 10px 22px -14px #5A1248;color:#fff}
.ivcard b{flex:1;font-family:var(--fd);font-size:21px;line-height:1.4;color:#fff}
.ivplay{width:46px;height:46px;border-radius:50%;background:#FFCB5C;display:grid;place-items:center;flex:none;box-shadow:0 0 0 6px rgba(255,203,92,.18);color:#2F2475}
.ivplay svg{width:22px;height:22px;margin-inline-end:-3px;transform:scaleX(-1)}
.ivfilm{color:#fff;opacity:.55;display:grid}.ivfilm svg{width:26px;height:26px}
.iv-ov{position:fixed;inset:0;z-index:30;background:rgba(10,8,30,.82);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.iv-box{width:min(100%,560px);display:flex;flex-direction:column;gap:10px}
.iv-video{width:100%;aspect-ratio:1/1;max-height:76vh;border-radius:18px;background:#000;display:block}
.iv-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#fff;font-family:var(--fd);font-size:18px}
.iv-bar .x{color:#fff;border-color:rgba(255,255,255,.5)}
@media (prefers-reduced-motion:no-preference){.ivplay{animation:ivpulse 2.2s infinite}@keyframes ivpulse{0%,100%{box-shadow:0 0 0 6px rgba(255,203,92,.18)}50%{box-shadow:0 0 0 11px rgba(255,203,92,.08)}}}
.lock{width:44px;height:44px;border-radius:12px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;flex:none}.lock svg{width:22px;height:22px}
.bub.sys.ask{background:var(--accsoft)}
.credit{text-align:center;font-size:12.5px;color:var(--muted);margin:26px 0 4px;line-height:1.9}
.credit b{font-weight:600;color:var(--ink)}
.instbtn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:7px 14px 7px 12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);font-weight:700;font-size:14px;box-shadow:0 6px 16px -8px var(--acc);white-space:nowrap}
.instbtn svg{width:20px;height:20px}
/* المعلّمة المتحركة (من مِران) */
.tutor{margin-bottom:4px;display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 14%,var(--card)),color-mix(in srgb,var(--pink) 12%,var(--card)));border:1px solid var(--line);position:sticky;top:6px;z-index:5;box-shadow:0 10px 24px -18px var(--acc)}
.tutor .avw{width:92px;height:92px;flex:none;position:relative}
.tutor svg.av{width:100%;height:100%;overflow:visible}
.tutor .tn b{display:block;font-family:var(--fd);font-size:18px;color:var(--ink)}
.tutor .ts{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--muted);margin-top:4px}
.tutor .ts i{width:8px;height:8px;border-radius:50%;background:#B8B4CC}
.tutor.talk .ts i{background:var(--acc);animation:tsp .8s infinite}.tutor.listen .ts i{background:#E8468A;animation:tsp .8s infinite}.tutor.happy .ts i{background:#0E9F77}
@keyframes tsp{50%{transform:scale(1.6);opacity:.5}}
.av .head{transform-origin:60px 80px;transition:transform .35s}
.av .eyes ellipse{transform-box:fill-box;transform-origin:center;animation:avblink 4.2s infinite}
@keyframes avblink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.av .mo{transform-box:fill-box;transform-origin:center;opacity:0}
.av .mc{transition:opacity .15s}
.tutor.talk .av .mo{opacity:1;animation:avtalk .26s infinite alternate}.tutor.talk .av .mc{opacity:0}
@keyframes avtalk{0%{transform:scaleY(.25) scaleX(.9)}60%{transform:scaleY(1)}100%{transform:scaleY(.55) scaleX(1.05)}}
.tutor.talk .av .head{animation:avnod 1.6s ease-in-out infinite}
@keyframes avnod{0%,100%{transform:rotate(0)}30%{transform:rotate(-2deg) translateY(-.5px)}70%{transform:rotate(2deg)}}
.tutor.listen .av .head{transform:rotate(-6deg)}
.av .waves{opacity:0;transition:opacity .25s}.tutor.listen .av .waves{opacity:1}
.av .waves path{animation:avwave 1.2s infinite}.av .waves path:nth-child(2){animation-delay:.3s}
@keyframes avwave{0%{opacity:.2}50%{opacity:1}100%{opacity:.2}}
.av .brow{transition:transform .3s}.tutor.listen .av .brow{transform:translateY(-2px)}.tutor.happy .av .brow{transform:translateY(-2.5px)}
.av .mh{opacity:0}.tutor.happy .av .mh{opacity:1}.tutor.happy .av .mc,.tutor.happy .av .mo{opacity:0;animation:none}
.tutor.happy .avw{animation:avhop .6s ease 2}
@keyframes avhop{40%{transform:translateY(-6px)}}
.av .spark{opacity:0}.tutor.happy .av .spark{opacity:1;animation:avsp 1.2s ease both}
@keyframes avsp{from{transform:scale(.4);opacity:0}40%{opacity:1}to{transform:scale(1.1);opacity:0}}
.tutor.think .av .head{transform:rotate(5deg)}.tutor.think .av .mc{transform:translateX(2px)}

.tutor .avw{width:104px;height:104px}
.av .body{animation:avbreath 3.4s ease-in-out infinite;transform-origin:60px 120px}
@keyframes avbreath{50%{transform:translateY(-1px) scaleY(1.01)}}
.av .hand{transform-origin:100px 124px;transform:rotate(18deg) translateY(16px);transition:transform .4s}
.tutor.talk .av .hand{transform:rotate(0) translateY(0);animation:avgest 1.8s ease-in-out .4s infinite}
.tutor.happy .av .hand{transform:rotate(-8deg) translateY(-2px)}
@keyframes avgest{0%,100%{transform:rotate(0)}35%{transform:rotate(-10deg) translateY(-2px)}70%{transform:rotate(6deg)}}
.av .eyes{transform-box:fill-box;transform-origin:center;animation:avblink2 4.6s infinite}
.av .eyes ellipse{animation:none}
@keyframes avblink2{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.av .pupils{animation:avlook 7s ease-in-out infinite}
@keyframes avlook{0%,30%,100%{transform:translate(0,0)}38%,52%{transform:translate(-1.4px,.3px)}60%,72%{transform:translate(1.3px,-.2px)}}

function tx(s){
  if (LANG === 'ar' || !s || !/[؀-ۿ]/.test(s)) return s;
  const k = s.trim();
  if (D[k]) return D[k][LI()];
  for (const [re, f] of P){ const m = k.match(re); if (m) return f(m)[LI()]; }
  if (k.startsWith('· ')) return '· ' + tx(k.slice(2));
  if (k.includes(' · ')) return k.split(' · ').map(tx).join(' · ');
  return s;
}

  const out = [];
  (X.seasons || []).forEach(s => (s.top || []).forEach((t, i) => { if (!has(t.uid, 'season', s.n)) out.push({uid:t.uid, name:t.name, gender:t.gender || 'm', kind:'season', season:s.n, rank:t.rank || i + 1, grade:t.grade || 0}); }));

}

    const [{initializeApp}, AI] = await Promise.all([import(AI_SDK + 'firebase-app.js'), import(AI_SDK + 'firebase-ai.js')]);
    const app = initializeApp(FB, 'nihao-ai');
    if (APPCHECK_SITE_KEY){
      const AC = await import(AI_SDK + 'firebase-app-check.js');
      const ac = AC.initializeAppCheck(app, {provider:new AC.ReCaptchaEnterpriseProvider(APPCHECK_SITE_KEY), isTokenAutoRefreshEnabled:true});
      AC.getToken(ac).catch(() => {});   // تجهيز رمز الحماية مبكراً حتى لا ينتظره أول رد
    }
    return {ai:AI.getAI(app, {backend:new AI.GoogleAIBackend()}), getGenerativeModel:AI.getGenerativeModel};
  })().catch(() => { aiDown = true; return null; });
  return aiPromise;
}
async function aiAsk(prompt){
  if (aiDown) return null;
  const k = await aiInit(); if (!k) return null;
  while (aiModelIdx < AI_MODELS.length){
    try{
      const name = AI_MODELS[aiModelIdx];
      const gc = {responseMimeType:'application/json', temperature:0.2, maxOutputTokens:500};
      if (aiThink){ gc.thinkingConfig = /^gemini-2\./.test(name) ? {thinkingBudget:0} : {thinkingLevel:'MINIMAL'}; }   // بلا تفكير مطوّل: ردّ أسرع
      const model = k.getGenerativeModel(k.ai, {model:name, generationConfig:gc});
      const res = await Promise.race([model.generateContent(prompt), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 15000))]);
      const out = JSON.parse(res.response.text());
      aiFails = 0; AIOK = true;
      return out && typeof out === 'object' ? out : null;
    }catch(e){
      const m = String((e && (e.message || e.code)) || e);
      if (aiThink && /thinking/i.test(m)){ aiThink = false; continue; }   // النموذج لا يقبل إعداد التفكير: نعيد بدونه
      if (/not.?found|404|unsupported|is not supported/i.test(m)){ aiModelIdx++; continue; }
      if (/api.?not.?enabled|permission|403|401|app.?check|unauthenticated|billing|quota/i.test(m) || ++aiFails >= 2) aiDown = true;
      return null;
    }
  }
  aiDown = true; return null;
}
async function aiJudge(turn, said, me, scene){
  if (!hasHan(said)) return null;
  const freeRule = `PERSONAL DETAILS ARE FREE: names, ages, numbers, quantities, prices, dates, times, places, nationalities, jobs, foods and other personal details are the learner's own choice. Never treat a difference from the example in these details as a mistake, never mark it as not fitting, and never change them in "corrected" (fix only grammar or wrong words around them).`;
  const common = `You check one spoken answer in a Mandarin speaking drill for an Arabic-speaking learner. Scenario: "${scene}". The learner's text is a speech-recognition transcript and may contain homophone mis-recognitions. ${freeRule}`;
  const fields = `"corrected": the learner's OWN sentence with its mistakes fixed, simplified characters, changing as little as possible (identical when already correct; empty when fits is false). "pinyin": tone-marked pinyin of "corrected". "notes": 0-2 short explanations IN ${AILANG()} of real grammar or word mistakes, naming the exact word; never invent mistakes; ignore punctuation. "ideal": a complete, natural model sentence in simplified Chinese that KEEPS every correctly-said word of the learner (their names, numbers, ages, colors, cities, countries, foods, jobs, hobbies and other details) and only fixes errors and adds what is missing to make a full, natural sentence for this exchange; never replace the learner's details with the example's; empty when fits is false. "ideal_pinyin": tone-marked pinyin of "ideal". "pronunciation": words that make no sense but sound like the intended word (wrong tone or similar sound) as {"said","said_pinyin","meant","meant_pinyin","tip"} with tip in ${AILANG()}; [] if none.`;
  const prompt = me
    ? `${common}
The learner starts the exchange and should say, in Chinese, a sentence meaning (Arabic): «${turn[2]}». Reference sentence: ${turn[0]}
Learner said: ${said}
You are the other person in the scenario. Reply ONLY with JSON:
{"fits":true,"corrected":"","pinyin":"","ideal":"","ideal_pinyin":"","notes":[],"pronunciation":[],"reply":{"zh":"","pinyin":"","ar":""}}
"fits": true only when the learner's sentence is understandable Chinese that carries the requested meaning (any natural wording counts). ${fields} "reply": ONE short natural sentence in simple Chinese that answers or reacts to the learner's sentence, with pinyin and a translation into ${AILANG().toLowerCase()}. The learner leads this conversation: do NOT ask any question, do NOT end with a question mark, and do NOT start a new topic. Empty strings when fits is false.`
    : `${common}
The app asked: ${turn[0]} (Arabic: «${turn[2]}»). Example of a good answer: ${turn[4]}
Learner said: ${said}
Reply ONLY with JSON:
{"fits":true,"corrected":"","pinyin":"","ideal":"","ideal_pinyin":"","notes":[],"pronunciation":[]}
"fits": true only when the learner's sentence is understandable Chinese AND a relevant, sensible answer to the question; its content may differ from the example. Off-topic, unrelated, or nonsense answers, or just repeating the question, are false. ${fields}`;
  const r = await aiAsk(prompt);
  if (!r || typeof r.fits !== 'boolean') return null;
  const rp = r.reply || {};
  return {
    fits: r.fits, corrected: str(r.corrected), pinyin: str(r.pinyin), ideal: str(r.ideal), idealPy: str(r.ideal_pinyin),
    notes: (Array.isArray(r.notes) ? r.notes : []).map(str).filter(Boolean).slice(0, 2),
    pron: (Array.isArray(r.pronunciation) ? r.pronunciation : []).map(p => ({said:str(p && p.said), sp:str(p && p.said_pinyin), meant:str(p && p.meant), mp:str(p && p.meant_pinyin), tip:str(p && p.tip)})).filter(p => p.meant && p.said && p.meant !== p.said).slice(0, 3),
    reply: {zh:str(rp.zh), pinyin:str(rp.pinyin), ar:str(rp.ar)}
  };
}

  const bk = BOOK.filter(x => x.g === myG), cur = bk.filter(x => x.s === myT), prev = bk.filter(x => x.s < myT);
  const tseg = `<div class="seg">${[[1, 'الفصل الأول'], [2, 'الفصل الثاني']].map(([k, n]) => `<button type="button" class="${myT === k ? 'on' : ''}" ${stu ? 'data-setterm' : 'data-bookt'}="${k}" aria-pressed="${myT === k}">${n}</button>`).join('')}</div>`;
  const books = myG ? `<div class="stack" style="gap:10px"><h2 class="lvh lvh${myG}"><i aria-hidden="true"></i>📘 محادثات كتاب ${GRADES[myG]}</h2>
    ${isParent(X.me) ? `<div class="seg">${[1, 2, 3].map(k => `<button type="button" class="${myG === k ? 'on' : ''}" data-bookg="${k}" aria-pressed="${myG === k}">${GRADES[k]}</button>`).join('')}</div>` : ''}
    <p class="sub" style="margin:0">مبنية على موضوعات دروس كتاب اللغة الصينية المقرر.</p>
    ${tseg}
    <h3 class="semh">${myT === 1 ? 'الفصل الدراسي الأول' : 'الفصل الدراسي الثاني'}</h3>${cur.map(btile).join('')}
    ${prev.length ? `<details class="stack"><summary style="cursor:pointer;font-weight:700">مراجعة الفصل الأول (${prev.length})</summary><div class="stack" style="gap:10px;margin-top:10px">${prev.map(btile).join('')}</div></details>` : ''}</div>` : '';
  const groups = [1, 2, 3].filter(l => !lv || l === lv).map(l => `<h2 class="lvh lvh${l}"><i aria-hidden="true"></i>محادثات المستوى ال${LV[l]}</h2>${TALKS.filter(x => x.l === l).map(tile).join('')}`).join('');
  return header() + inappNote() + `<div class="band"><span class="tcmic">${MICSVG}</span><div class="grow"><h1>المحادثة الصوتية</h1><p class="sub">تحدّث بالصينية، والتطبيق يسمعك ويصحّح لك.</p></div></div>
  <div class="sec">
   ${X.admin && X.rows ? `<button class="tile" data-act="admin"><span class="grow"><h3>لوحة المشرف</h3><span class="meta">طلبات انضمام بانتظارك: ${X.rows.filter(r => r.status === 'pending').length}</span></span><span class="go">‹</span></button>` : ''}
   <button type="button" class="ivcard" data-act="intro"><span class="ivplay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" fill="currentColor"/></svg></span><b>تعرّف على ني هاو</b><span class="ivfilm" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3" fill="none"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4" fill="none"/></svg></span></button>
   ${vComp()}
   ${X.me && X.uid ? '<div class="foot"><button class="x" data-act="mylink">الدخول من جهاز آخر</button></div>' : ''}
   ${X.me && X.me.status === 'approved' ? `
   ${!chT ? '' : `<div class="chal"><div class="grow"><span class="lbl">🏆 تحدي الأسبوع</span><h3>${chT.t}</h3><span class="meta"><span>الدرس ${chT.n}</span> · نقاط مضاعفة ×2 حتى نهاية الأسبوع</span></div><button class="btn" data-talk="${chT.id}">ابدأ</button></div>`}
   <div class="stack" style="gap:6px"><span class="lbl">من يبدأ الحوار؟</span>
    <div class="seg">${[['app','التطبيق يسأل وأنا أجيب'],['me','أنا أبدأ والتطبيق يرد']].map(([v, n]) => `<button class="${(SAVE.mode === 'me' ? 'me' : 'app') === v ? 'on' : ''}" data-mode="${v}" aria-pressed="${(SAVE.mode === 'me' ? 'me' : 'app') === v}">${n}</button>`).join('')}</div>
    <div class="card"><p style="margin:0;font-size:14px">${SAVE.mode === 'me'
      ? '<b>أنت المبادر:</b> يظهر لك معنى الجملة بالعربية، فتقولها أنت بالصينية بصوتك، والتطبيق يرد عليك فقط ولا يسألك. أنت من يقود الحوار.'
      : '<b>التطبيق المبادر:</b> يسألك التطبيق بصوته، وأنت تجيب بما تريد.'} تُقبل أي جملة صينية مفهومة ولها علاقة بالحوار، ثم يُعرض لك الرد المثالي لتقارن وتتعلّم.</p></div></div>
   ${books}
   <h2 style="margin-top:6px">محادثات عامة للتدريب الحر</h2>
   <p class="sub" style="margin:0">للتدريب فقط، ولا تُحتسب فيها نقاط المنافسة.</p>
   <div class="stack" style="gap:6px"><span class="lbl">المستوى <small>(اختياري)</small></span>
    <div class="seg">${[[0,'الكل'],[1,'بسيط'],[2,'متوسط'],[3,'صعب']].map(([v, n]) => `<button class="${lv === v ? 'on' : ''}" data-lv="${v}" aria-pressed="${lv === v}">${n}</button>`).join('')}</div></div>
   ${groups}` : lockNote()}
   ${X.off || X.admin ? '' : '<div class="foot"><button class="x" data-act="admin">دخول المشرف</button></div>'}
   ${CREDIT}
  </div>`;
}
function vRun(){
  const s = TK.sc, n = s.turns.length;
  const log = TK.log.map(m => m.w === 'bot'
    ? `<div class="bub bot pop"><div lang="zh">${esc(m.t)}</div><div class="py">${esc(m.py)}</div><div class="bubtools"><button class="x" data-say="${esc(m.t)}">${SPK} استمع</button>${m.ar ? '<button class="x" data-tr="1">ترجمة</button>' : ''}</div>${m.ar ? `<div class="bubar" hidden>${esc(m.ar)}</div>` : ''}</div>`
    : m.w === 'ask' ? `<div class="bub sys ask pop"><b>دورك:</b> قل بالصينية: «${esc(m.ar)}»</div>`
    : m.w === 'me' ? `<div class="bub me pop" lang="zh">${esc(m.t)}</div>`
    : `<div class="bub sys ${m.ok ? 'ok' : ''} pop">${m.h}${m.say ? `<div><button class="x" data-say="${esc(m.say)}">${SPK} استمع للإجابة</button></div>` : ''}</div>`).join('');
  let ctl;
  if (TK.done){
    const pct = Math.round(100 * TK.first / n);
    ctl = `<div class="card stack" style="text-align:center;align-items:center"><div class="big">${TK.first}/${n}</div><p style="margin:0">فهمتك من أول محاولة في ${TK.first} من ${n} جمل (${pct}%).</p>${TK.pts ? `<p style="margin:0"><span class="chip">+${TK.pts} نقطة في هذه المحادثة</span></p>` : ''}
     <div class="row" style="width:100%"><button class="btn grow" data-talk="${s.id}">إعادة المحادثة</button><button class="btn plain grow" data-act="tkList">محادثة أخرى</button></div></div>`;
  }
  else if (TK.busy) ctl = `<div class="wait" role="status" aria-label="أصحّح إجابتك"><i></i><i></i><i></i></div>`;
  else if (TK.waitNext) ctl = `<button class="btn wide" data-act="tkNext">${TK.i < n - 1 ? 'الجملة التالية' : 'عرض النتيجة'}</button>`;
  else ctl = `<div class="tkctl">${typingMode
    ? `<form id="tkform" class="row" style="width:100%"><input type="text" id="tkin" lang="zh" dir="ltr" autocomplete="off" placeholder="${TK.mode === 'me' ? 'اكتب جملتك بالصينية…' : 'اكتب إجابتك بالصينية…'}" class="grow" aria-label="إجابتك"><button class="btn" type="submit">إرسال</button></form><p class="note">للإجابة بصوتك: اضغط زر المايكروفون في لوحة المفاتيح الصينية.</p>${SR ? '<button class="x" data-act="tkMicMode">العودة للتحدث بالصوت</button>' : ''}`
    : `<button class="mic ${TK.listening ? 'on' : ''}" data-act="tkMic" aria-label="${TK.listening ? 'إيقاف' : 'تكلّم'}">${MICSVG}</button><div class="tklive" id="tklive" lang="zh">${TK.listening ? '…' : ''}</div><p class="note">${TK.listening ? 'أستمع إليك… تكلّم الآن، ثم اضغط للإيقاف' : 'اضغط وتكلّم بالصينية'}</p><button class="x" data-act="tkType">اكتب بدلاً من ذلك</button>`}
    ${TK.attempts < 2 ? `<button class="x" data-act="tkShow">${TK.mode === 'me' ? 'لا أعرف، أظهر الجملة' : 'لا أعرف، اقترح رداً'}</button>` : ''}</div>`;
  return header() + inappNote() + `<div class="qhead"><h2>${s.t}${LANG === 'zh' ? '' : ` <span class="zh" lang="zh" style="font-size:16px;color:var(--muted)">${s.z}</span>`}</h2><button class="x" data-act="tkQuit">إنهاء</button></div>
  <div class="sec"><p class="prog">الجملة ${Math.min(TK.i + 1, n)} من ${n} · ${s.book ? 'كتاب ' + GRADES[s.g] + ' · ' + (s.s === 2 ? 'الفصل الثاني' : 'الفصل الأول') + ' · الوحدة ' + s.u + (s.n ? ' · الدرس ' + s.n : '') : 'المستوى ال' + LV[s.l]} · ${TK.mode === 'me' ? 'أنت تبدأ' : 'التطبيق يبدأ'}${AIOK ? ' · تصحيح بالذكاء الاصطناعي' : ''}${isParent(X.me) ? ' · وضع الاطلاع (بلا نقاط)' : !s.book ? ' · تدريب حر بلا نقاط' : s.id === challenge() ? ' · تحدي الأسبوع ×2' : ''}</p><div class="bar"><i style="width:${100 * (TK.done ? n : TK.i) / n}%"></i></div>
  ${s.txt ? `<details class="card lesson" ${TK.i === 0 && !TK.log.some(m => m.w === 'me') ? 'open' : ''}><summary>📖 نص الدرس</summary><div class="ltxt" dir="ltr">${s.txt.map(l => { const k = l.indexOf('：'); const who = k > 0 && k < 8 ? l.slice(0, k) : '', say = who ? l.slice(k + 1) : l; return `<div class="lline">${who ? `<b lang="zh">${esc(who)}：</b>` : ''}<span lang="zh">${esc(say)}</span><button class="x" data-say="${esc(say)}" aria-label="استمع">${SPK}</button></div>`; }).join('')}</div></details>` : ''}
  ${tutorCard()}<div class="chat" aria-live="polite">${log}</div>${ctl}</div>${CREDIT}`;
}
function render(){ app.innerHTML = view === 'run' && TK ? vRun() : view === 'admin' ? vAdmin() : view === 'preview' && X.admin ? vPreview() : view === 'certs' && X.me ? vCerts() : view === 'honor' && (X.me || X.admin) ? vHonor() : vList(); }

/* ============ المقطع التعريفي ============ */
function closeIntro(){ const el = document.getElementById('intro'); if (!el) return; const v = el.querySelector('video'); if (v){ try{ v.pause(); }catch(e){} } el.remove(); document.body.style.overflow = ''; }
function openIntro(){
  closeIntro(); try{ speechSynthesis.cancel(); }catch(e){}
  const el = document.createElement('div');
  el.id = 'intro'; el.className = 'iv-ov'; el.dir = document.documentElement.dir; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'تعريف بتطبيق ني هاو');
  el.innerHTML = '<div class="iv-box"><div class="iv-bar"><span>تعرّف على ني هاو</span><button type="button" class="x" id="ivclose">إغلاق</button></div><video class="iv-video" src="intro.mp4?v=2" poster="intro-poster.jpg" controls playsinline autoplay preload="auto"></video></div>';
  el.addEventListener('click', e => { if (e.target === el || e.target.id === 'ivclose') closeIntro(); });
  document.body.appendChild(el); document.body.style.overflow = 'hidden';
  const v = el.querySelector('video'); const p = v.play(); if (p && p.catch) p.catch(() => {});
  el.querySelector('#ivclose').focus();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeIntro(); });

/* ============ الأحداث ============ */
function quit(){ tkStopRec(); try{ speechSynthesis.cancel(); }catch(e){} TK = null; go('list'); }
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.talk){ tkStopRec(); startTalk(b.dataset.talk); return; }
  if (b.dataset.mode){ SAVE.mode = b.dataset.mode; persist(); render(); return; }
  if (b.dataset.lv != null){ SAVE.level = +b.dataset.lv; persist(); render(); return; }
  if (b.dataset.say){ speak(b.dataset.say); return; }
  if (b.dataset.tr){ const a = b.closest('.bub').querySelector('.bubar'); if (a) a.hidden = !a.hidden; return; }
  if (b.dataset.act === 'intro'){ openIntro(); return; }
  if (b.dataset.lang){ setLang(b.dataset.lang); return; }
  if (b.dataset.gen){ JF.gender = b.dataset.gen; JF.role = b.dataset.role || 'student'; X.err = ''; render(); return; }
  if (b.dataset.jterm){ JF.term = +b.dataset.jterm; render(); return; }
  if (b.dataset.setterm){ const k = +b.dataset.setterm; if (X.me) X.me.term = k; fsP.collection(COL).doc(X.uid).update({term:k}).then(() => toast('تم: ' + TERMS[k]), () => toast('تعذّر الحفظ. تحقق من الإنترنت.')); render(); return; }
  if (b.dataset.bookt){ SAVE.bookT = +b.dataset.bookt; persist(); render(); return; }
  if (b.dataset.jgrade){ JF.grade = +b.dataset.jgrade; X.err = ''; render(); return; }
  if (b.dataset.setgrade){ const k = +b.dataset.setgrade; if (X.me) X.me.grade = k; fsP.collection(COL).doc(X.uid).update({grade:k}).then(() => toast('تم حفظ صفك: ' + GRADES[k]), () => toast('تعذّر الحفظ. تحقق من الإنترنت.')); render(); return; }
  if (b.dataset.bookg){ SAVE.bookG = +b.dataset.bookg; persist(); render(); return; }
  if (b.dataset.alink){ adminLink(b.dataset.alink); return; }
  if (b.dataset.act === 'mylink'){ myLink(); return; }
  if (b.dataset.act === 'logout'){ askLogout(); return; }
  if (b.dataset.adm){ adminDo(b.dataset.adm, b.dataset.id); return; }
  if (b.dataset.act === 'preview'){ X.err = ''; go('preview'); return; }
  if (b.dataset.act === 'admin'){ X.err = ''; go('admin'); return; }
  if (b.dataset.act === 'home'){ X.err = ''; X.confirm = ''; go('list'); return; }
  if (b.dataset.act === 'adminOut'){ if (authA) authA.signOut(); go('list'); return; }
  if (b.dataset.act === 'certs'){ go('certs'); return; }
  if (b.dataset.act === 'honor'){ X.back = view; go('honor'); return; }
  if (b.dataset.act === 'goback'){ go(X.back === 'admin' ? 'admin' : 'list'); return; }
  if (b.dataset.cert){ const c = (X.certs || []).find(x => x.id === b.dataset.cert); if (c) openCert(c); return; }
  if (b.dataset.cdel){ const id = b.dataset.cdel; if (X.confirm !== 'cdel' + id){ X.confirm = 'cdel' + id; return render(); } X.confirm = ''; fsA.collection('zhCerts').doc(id).delete().then(() => toast('تم إلغاء الشهادة'), afail); return; }
  if (b.dataset.pc != null){ const p = (X.pend || [])[+b.dataset.pc]; if (!p) return; if (b.dataset.pv === 'view') openCert(Object.assign({at:Date.now()}, p)); else issueCert(p, b.dataset.pv); return; }
  if (b.dataset.act === 'endSeason'){ endSeason(); return; }
  if (b.dataset.act === 'saveSigner'){ const v = (($('#signer') && $('#signer').value) || '').trim().slice(0, 40); fsA.collection('zhConfig').doc('main').set({signer:v}, {merge:true}).then(() => toast(v ? 'تم حفظ الاسم' : 'تم حذف الاسم'), afail); return; }
  if (b.dataset.act === 'full'){ X.full = !X.full; render(); return; }
  if (b.dataset.act === 'install'){ const ev = installEvt; if (ev){ installEvt = null; ev.prompt(); render(); } else installHelp(); return; }
  const act = b.dataset.act; if (!act || (!TK && act !== 'tkList')) return;
  if (act === 'tkMic') tkListen();
  else if (act === 'tkType'){ tkStopRec(); typingMode = true; render(); const i = $('#tkin'); if (i) i.focus(); }
  else if (act === 'tkMicMode'){ typingMode = false; render(); }
  else if (act === 'tkShow') tkShow();
  else if (act === 'tkNext'){ tkNext(); const i = $('#tkin'); if (i) i.focus(); }
  else if (act === 'tkQuit' || act === 'tkList') quit();
});
document.addEventListener('toggle', e => { if (e.target && e.target.id === 'logindet' && e.target.open && view !== 'preview') loadNames(); }, true);
app.addEventListener('input', e => { if (e.target.id === 'jname') JF.name = e.target.value; if (e.target.id === 'jpin') JF.pin = e.target.value; });
/* المشرف يصحّح صفة المسجّل إذا أخطأ في التسجيل (طالب، ولي أمر، معلم…) */
app.addEventListener('change', e => {
  if (e.target.dataset && e.target.dataset.termof && X.admin){ fsA.collection(COL).doc(e.target.dataset.termof).update({term:+e.target.value}).then(() => toast('تم تغيير الفصل'), afail); return; }
  if (e.target.dataset && e.target.dataset.gradeof && X.admin){ const v = +e.target.value; fsA.collection(COL).doc(e.target.dataset.gradeof).update({grade:v || firebase.firestore.FieldValue.delete()}).then(() => toast('تم تغيير الصف'), afail); return; }
  const id = e.target.dataset && e.target.dataset.kind; if (!id || !X.admin || !fsA) return;
  const [role, gender] = e.target.value.split(':');
  fsA.collection(COL).doc(id).update({role, gender, updated:Date.now()}).then(() => toast('تم تغيير الصفة'), () => toast('لم يُنفَّذ الطلب. تحقق من الإنترنت ومن نشر قواعد قاعدة البيانات.'));
});
app.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'loginform'){ if (view === 'preview'){ toast('هذه معاينة فقط، لا يُرسل الطلب.'); return; } if (!X.busy) enterWithCode(); return; }
  if (e.target.id === 'pinform'){ if (!X.busy) savePin(); return; }
  if (e.target.id === 'joinform'){ if (view === 'preview'){ toast('هذه معاينة فقط، لا يُرسل الطلب.'); return; } if (!X.busy) join(); return; }
  if (e.target.id === 'specform'){ const id = ($('#scuid') && $('#scuid').value) || '', t = (($('#sctitle') && $('#sctitle').value) || '').trim().slice(0, 40); const r = (X.rows || []).find(x => x.id === id);
    if (!r || !t) return toast('اختر الطالب واكتب سبب التميّز.'); issueCert({uid:r.id, name:r.name || '', gender:r.gender || 'm', kind:'special', title:t}, 'ok'); e.target.reset(); return; }
  if (e.target.id === 'admform'){ if (!X.busy) adminLogin(); return; }
  const i = $('#tkin'); if (!i || !TK || TK.busy) return;
  const v = i.value.trim(); if (v) tkEval([v.slice(0, 300)]);
});
render();
fbStart();
</script>

</body>

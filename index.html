<body>
<title>مِران</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* لوحة ألوان: لكل قسم لونه الخاص */
:root{
  --paper:#F4F2FF;--card:#FFFFFF;--ink:#1B1840;--muted:#5E5A80;--line:#E3E0F2;
  --chalk:#F5B82E;--ok:#16A36A;--okbg:#DDF7EA;--bad:#E5484D;--badbg:#FDE5E6;
  --home:#5B4BDB;--en:#1E7BF2;--qd:#8B3FE0;--th:#0E9F77;--cp:#F2780C;--pink:#E8468A;
  --acc:var(--home);--onacc:#FFFFFF;--rule:#F2780C;
  --fd:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --fb:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fe:"Lexend","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--paper:#110F24;--card:#1C1936;--ink:#EDEBFA;--muted:#A6A2C6;--line:#2E2A50;--chalk:#FFCB5C;--ok:#4FD69A;--okbg:#123427;--bad:#FF7A7E;--badbg:#3C1A22;--home:#9D91FF;--en:#63A9FF;--qd:#B98BFF;--th:#3FD5A6;--cp:#FFA94D;--pink:#FF7EB3;--onacc:#120F26;--rule:#FFA94D}
}
:root[data-theme="dark"]{color-scheme:dark;--paper:#110F24;--card:#1C1936;--ink:#EDEBFA;--muted:#A6A2C6;--line:#2E2A50;--chalk:#FFCB5C;--ok:#4FD69A;--okbg:#123427;--bad:#FF7A7E;--badbg:#3C1A22;--home:#9D91FF;--en:#63A9FF;--qd:#B98BFF;--th:#3FD5A6;--cp:#FFA94D;--pink:#FF7EB3;--onacc:#120F26;--rule:#FFA94D}
body[data-sec="en"]{--acc:var(--en)}body[data-sec="qd"]{--acc:var(--qd)}body[data-sec="th"]{--acc:var(--th)}body[data-sec="cp"]{--acc:var(--cp)}
body{--accsoft:color-mix(in srgb,var(--acc) 13%,var(--card));--acc2:color-mix(in srgb,var(--acc) 62%,var(--pink))}

body{background:var(--paper);background-image:radial-gradient(900px 420px at 100% -10%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 70%),radial-gradient(700px 380px at -10% 0%,color-mix(in srgb,var(--pink) 10%,transparent),transparent 70%);background-repeat:no-repeat;color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.6;min-height:100vh;transition:background-color .3s}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:8px 120px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 14px}
.insttop{display:inline-flex;align-items:center;gap:4px;border:none;border-radius:99px;padding:6px 12px;font:inherit;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--pink));box-shadow:0 6px 14px -8px var(--acc);cursor:pointer;white-space:nowrap}.insttop span{font-size:16px}
.insthelp{margin:0 0 10px;border:2px dashed color-mix(in srgb,var(--acc) 50%,transparent)}.insthelp p{margin:8px 0 0;line-height:1.8}
.brand{font-family:var(--fd);font-weight:800;font-size:28px;line-height:1;background:linear-gradient(135deg,var(--acc),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.band{border-radius:20px;padding:20px;color:var(--onacc);background:linear-gradient(135deg,var(--acc),var(--acc2));position:relative;overflow:hidden;box-shadow:0 12px 30px -16px var(--acc)}
.band::after{content:"";position:absolute;inset-inline-end:-40px;top:-50px;width:170px;height:170px;border-radius:50%;background:color-mix(in srgb,var(--onacc) 14%,transparent)}
.band h1{position:relative}.band .sub{color:inherit;opacity:.9;position:relative}
.who{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding-block:4px;padding-inline:12px 4px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;background:var(--acc);color:var(--onacc);flex:none}
.av.lg{width:48px;height:48px;font-size:22px}
.av.m{background:linear-gradient(135deg,#1E7BF2,#5B4BDB);color:#fff}.av.f{background:linear-gradient(135deg,#E8468A,#8B3FE0);color:#fff}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:28px;font-weight:800}h2{font-size:21px;font-weight:700}h3{font-size:17px;font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 4px 18px -12px color-mix(in srgb,var(--acc) 40%,transparent)}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:color-mix(in srgb,var(--c,var(--acc)) 12%,var(--card));border:1px solid color-mix(in srgb,var(--c,var(--acc)) 25%,transparent);border-radius:14px;padding:10px 12px}
.stat b{color:var(--c,var(--acc))}
.stat b{display:block;font-family:var(--fd);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 28px -14px var(--acc);color:var(--onacc);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.hero .sub{color:inherit;opacity:.85}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--acc);transform:translateY(-1px)}
.tile h3{color:var(--acc)}
.tile .ic{width:42px;height:42px;border-radius:12px;background:var(--accsoft);color:var(--acc);display:grid;place-items:center;flex:none}
.tile .ic svg{width:22px;height:22px}
.tile .meta{font-size:13px;color:var(--muted)}
.tile .go{font-size:28px;color:var(--acc);line-height:1;flex:none}
.plan{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.plan button{width:100%;text-align:start;border:none;color:inherit;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--onacc) 12%,transparent)}
.plan button:not(.done){background:var(--onacc);color:var(--ink)}
.plan button b{color:var(--c)}.plan button:not(.done) .n{background:var(--c);border-color:var(--c);color:#fff}.plan button:not(.done) .go{color:var(--c)}
.plan button.done{opacity:.8}
.plan .go{font-size:26px;line-height:1}
.plan li{list-style:none}.plan button{align-items:center;gap:12px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--onacc) 14%,transparent)}
.plan .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--fd);font-weight:700;border:2px solid currentColor;flex:none}
.plan button.done .n{background:var(--onacc)}.plan button.done .n i{color:var(--acc);font-style:normal}
.plan .m2{font-size:12px;opacity:.85}
.mushaf{background:#FFFDF6;border:1px solid #E8DDBF;border-radius:18px;padding:14px 16px;color:#1d1a12;box-shadow:inset 0 0 0 4px #FFF8E6}
.mushaf,.qv .qtxt,.basm{font-family:"Amiri Quran","Amiri","Scheherazade New","Traditional Arabic",serif}
.basm{text-align:center;font-size:24px;margin:2px 0 10px;color:#0E7C66}
.qv{padding:8px 6px;border-radius:12px;margin:2px 0;line-height:2.3;font-size:25px}.qv.cur{background:#FFF1C9;box-shadow:0 0 0 2px #E9C46A inset}.qv.pass{opacity:.85}
.qnum{color:#B8892E;font-size:20px;white-space:nowrap}.qok{color:#0E7C66}.qno{color:#C62828;text-decoration:underline wavy rgba(198,40,40,.5)}
.qhide{font-family:var(--fb);font-size:15px;color:#8a7a50;display:inline-flex;flex-wrap:wrap;align-items:center;gap:8px}.qhintw{font-family:"Amiri Quran","Amiri",serif;font-size:24px;color:#0E7C66}
.qmsg{font-family:var(--fb);font-size:13px;color:#a33;line-height:1.6}.qmsg.ok{color:#0E7C66;font-weight:700}
.qgo{font-size:19px;padding:16px}.qgo.on{background:linear-gradient(135deg,#C62828,#E8468A)}
.qctl{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:14px}.qhz{font-size:14px;display:flex;gap:8px;align-items:center}
.qcard{display:flex;align-items:center;gap:14px;width:100%;text-align:start;border:none;border-radius:18px;padding:16px;color:#fff;background:linear-gradient(135deg,#0E7C66,#C9A13B);cursor:pointer}.qcard b{display:block;font-family:var(--fd);font-size:21px}.qcard span span{display:block;font-size:13px;opacity:.95}.qcard .qi{font-size:30px}
.qgrid{display:flex;flex-wrap:wrap;gap:6px}.qs{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.ajr{background:#FFFBEA;border-color:#EAD9A0;line-height:1.9}.ajr p{margin:6px 0}.boostc{border:2px dashed #C9A13B}
.qpick{border:2px solid #C9A13B}.qs.sug{background:linear-gradient(135deg,#0E7C66,#C9A13B);color:#fff;border:none;font-weight:700;font-size:15px;padding:10px 14px}.qs small{opacity:.7}
.qprompt{text-align:center;background:linear-gradient(135deg,#0E7C66,#2A5C8A)!important}
.rkl{font-size:12px;font-weight:700;color:var(--cp)}.legend{padding:12px 14px}.lgrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}.lgrow .tb small{font-weight:600;opacity:.8;margin-inline-start:2px}.lgar{color:var(--muted);font-size:14px}
.rk2{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--cp) 10%,transparent);border-radius:99px;padding:3px 10px 3px 4px}.rk2 i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:11px}
.tb{font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px;white-space:nowrap;margin-inline-end:4px}
.tb.t0{background:color-mix(in srgb,var(--th) 13%,transparent);color:var(--th)}.tb.t1{background:#F6DDCD;color:#7A3E12}.tb.t2{background:#E6E9F0;color:#3E4658}.tb.t3{background:#FFEDB0;color:#7A5200}.tb.t4{background:linear-gradient(90deg,#FFD86B,#F2780C);color:#3d2200}
.brd .n.p1{background:#F5C542;color:#3d2a00;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}.brd .n.p2{background:#C9CED8;color:#262b36;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}.brd .n.p3{background:#D79B76;color:#3a1c0b;border-radius:50%;width:26px;height:26px;display:grid;place-items:center}
.chase{margin:10px 0 0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--cp) 12%,transparent);color:var(--ink);font-size:14px;line-height:1.7}
.hpath{padding:14px 14px 12px}.hsteps{position:relative;display:flex;justify-content:space-between;margin:14px 2px 6px}
.hline{position:absolute;top:19px;inset-inline:18px;height:5px;border-radius:3px;background:var(--line);z-index:0}.hline i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--th),var(--cp))}
[dir=rtl] .hline i,.hline i{margin-inline-start:0}
.hs{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;width:20%;text-align:center}
.hs .hd{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:var(--card);border:2px solid var(--line);filter:grayscale(1);opacity:.55}
.hs.done .hd{filter:none;opacity:1;border-color:var(--th)}.hs.cur .hd{filter:none;opacity:1;border-color:var(--cp);box-shadow:0 0 0 5px color-mix(in srgb,var(--cp) 22%,transparent);transform:scale(1.12)}
.hs .hn{font-size:11.5px;font-weight:700;line-height:1.2}.hs .hp{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.hs:last-child .hd{width:44px;height:44px;font-size:24px}
.hmsg{margin:8px 0 0;text-align:center;font-size:14.5px;line-height:1.7}
.celeb{text-align:center;margin-bottom:12px}
.medal{display:inline-flex;flex-direction:column;align-items:center;flex:none;margin-inline-start:auto;margin-inline-end:6px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.medal .disc{position:relative;z-index:1;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--m1),var(--m2) 70%,var(--m3));box-shadow:inset 0 0 0 3px var(--m2),inset 0 0 0 5px rgba(255,255,255,.55)}
.medal .disc b{font-family:var(--fd);font-weight:800;font-size:12.5px;letter-spacing:-.2px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35);line-height:1}
.medal .rib{width:28px;height:18px;margin-top:-6px;background:linear-gradient(180deg,#c94a3d,#a8352b);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.medal.gold{--m1:#F7DE86;--m2:#C9A13B;--m3:#8E6A1E}.medal.silver{--m1:#F4F4F4;--m2:#B5B5B5;--m3:#7E7E7E}.medal.bronze{--m1:#D99A7C;--m2:#9A5A42;--m3:#5E3122}
.instcard{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:2px dashed color-mix(in srgb,var(--th) 55%,transparent);border-radius:16px;padding:10px 14px;background:color-mix(in srgb,var(--th) 9%,var(--card));color:var(--ink);cursor:pointer;margin:6px 0 4px;font:inherit}
.instcard b{font-family:var(--fd);font-size:18px;color:var(--th)}.instcard .ic2{font-size:24px}
.instcard.ios{display:block}.instcard.ios summary{display:flex;align-items:center;gap:12px;list-style:none;cursor:pointer}.instcard.ios summary::-webkit-details-marker{display:none}.instcard.ios p{margin:10px 0 2px;line-height:1.8}.instcard p b{font-family:inherit;font-size:inherit;color:var(--ink)}
.motto{margin:6px 0 14px;text-align:center;font-family:var(--fd);font-weight:800;font-size:clamp(20px,5.4vw,24px);line-height:1.4;background:linear-gradient(90deg,#FF7A18,#E8468A 55%,#8B3FE0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ivcard{display:flex;align-items:center;gap:12px;width:100%;text-align:start;border:none;border-radius:16px;padding:10px 14px;background:linear-gradient(135deg,#1F1A4A,#2F2475);box-shadow:0 10px 22px -14px #1F1A4A;cursor:pointer;margin:6px 0 4px}
.ivcard,.ivcard *{color:#fff!important}.ivcard b{flex:1;font-family:var(--fd);font-size:19px}.ivcard.big{padding:13px 16px}.ivcard.big b{font-size:21px}
.ivplay{width:40px;height:40px;border-radius:50%;background:#FFCB5C;display:grid;place-items:center;flex:none;box-shadow:0 0 0 6px rgba(255,203,92,.18);animation:ivpulse 2.2s infinite}
.ivplay svg{width:20px;height:20px;margin-left:3px}.ivplay svg path{fill:#2F2475}
.ivfilm svg{width:24px;height:24px;opacity:.55}
.iv-ov{position:fixed;inset:0;z-index:100;background:rgba(14,10,40,.78);display:grid;place-items:center;padding:14px;animation:ivfade .3s}
.iv-box{width:min(560px,100%,calc(100vh - 110px));display:flex;flex-direction:column;gap:10px}
.iv-stage{position:relative;aspect-ratio:4/3.4;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#4F5BF0,#7B3FE0 50%,#E8468A);color:#fff;box-shadow:0 30px 60px -20px #000}
.iv-stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 25% 18%,rgba(255,255,255,.25),transparent 50%)}
.iv-sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;animation:ivin .55s ease both}
.iv-sc h2{margin:0;font-family:var(--fd);font-size:clamp(22px,5.5vw,30px);text-shadow:0 4px 14px rgba(30,10,80,.35)}
.iv-vis{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.iv-cap{min-height:58px;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font-size:16px;line-height:1.7;text-align:center;font-weight:600}
.iv-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iv-dots{display:flex;gap:6px}.iv-dots i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}.iv-dots i.on{background:#FFCB5C}.iv-dots i.done{background:#fff}
.iv-ctl{display:flex;gap:6px}.iv-ctl button{width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:#fff;font-size:16px;cursor:pointer}
.iv-video{width:100%;aspect-ratio:1/1;border-radius:22px;background:#120d33;box-shadow:0 30px 60px -20px #000;display:block}.iv-close{border:none;border-radius:99px;padding:9px 18px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.iv-note{margin:0;color:#fff;opacity:.85;font-size:13px;text-align:center}
.iv-logo{position:relative;width:110px;height:110px;border-radius:28px;background:rgba(255,255,255,.18);display:grid;place-items:center;animation:ivpop .6s .1s both}
.iv-logo span{font-family:var(--fd);font-weight:800;font-size:72px;line-height:1}.iv-logo i{position:absolute;top:10px;left:12px;color:#FFCB5C;font-style:normal;font-size:24px;animation:ivtw 1.6s infinite}
.iv-big{font-family:var(--fd);font-weight:800;font-size:clamp(34px,9vw,48px);animation:ivup .6s .25s both}
.iv-sub{font-size:16px;opacity:.9;animation:ivup .6s .45s both}
.iv-chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.iv-chips b{background:rgba(255,255,255,.22);border-radius:99px;padding:4px 14px;animation:ivup .5s both}.iv-chips b:nth-child(2){animation-delay:.5s}.iv-chips b:nth-child(3){animation-delay:.8s}.iv-chips b:first-child{animation-delay:.2s}
.iv-cards{display:flex;flex-direction:column;gap:9px;width:min(320px,100%)}
.iv-cards div{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:16px;background:linear-gradient(135deg,var(--c),var(--c2));font-family:var(--fd);font-size:20px;font-weight:700;box-shadow:0 10px 20px -10px rgba(0,0,0,.5);animation:ivside .5s both}
.iv-cards div:nth-child(1){animation-delay:.3s}.iv-cards div:nth-child(2){animation-delay:1.6s}.iv-cards div:nth-child(3){animation-delay:3s}
.iv-cards span{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.28);display:grid;place-items:center}
.iv-q{background:#fff;color:#1d1640;border-radius:18px;padding:14px;width:min(300px,100%);display:flex;flex-direction:column;gap:7px;animation:ivpop .5s .2s both}
.iv-q p{margin:0 0 4px;font-weight:700;font-size:18px}.iv-q div{border:2px solid #e3e0f5;border-radius:12px;padding:6px}.iv-q div.ok{border-color:#0E9F77;background:#e3f7ef;color:#0b7a5c;font-weight:700;animation:ivok .5s 1.4s both}
.iv-q em{font-style:normal;font-size:13px;color:#0b7a5c;animation:ivup .5s 2.2s both}
.iv-steps{display:flex;flex-direction:column;gap:8px;width:min(300px,100%)}

function adRow(s){if(A.edit===s.id)return adForm(s.id);const l=A.links[s.id];
 return `<div class="card stack"><div class="row"><span class="av ${s.gender}">${esc((s.name||'؟').trim()[0])}</span><span class="grow"><b>${esc(s.name)}</b><br><span class="note">${GRADES[s.grade]} · ${TERMS[s.term]||''} · ${s.score} نقطة · ${s.answers} سؤال${s.last?' · آخر تدريب '+s.last:''}</span></span></div>

async function adminApprove(id){await stuRef(id).update({status:'approved',approvedAt:Date.now()})}
function adPendRow(s){return `<div class="card stack" style="border:2px solid #FFCB5C"><div class="row"><span class="av ${s.gender}">${esc((s.name||'؟').trim()[0])}</span><span class="grow"><b>${esc(s.name)}</b><br><span class="note">${s.role==='parent'?`👨‍👩‍👧 ولي أمر (${s.gender==='f'?'أم':'أب'}) · للاطلاع فقط`:`${s.gender==='f'?'طالبة':'طالب'} · ${GRADES[s.grade]} · ${TERMS[s.term]||''}`}${s.created?' · '+new Date(s.created).toLocaleDateString('ar-SA'):''}</span></span></div>
 <div class="row"><button class="btn grow" data-adok="${s.id}">✓ قبول</button><button class="btn plain grow" style="color:var(--bad)" data-adno="${s.id}">رفض</button></div>${adLinkBox(s)}</div>`}
const anorm=t=>QNORM(t||'').replace(/^(ال)/,'');
function adSimilar(s,o){const a=anorm(s.name).split(' ')[0],b=anorm(o.name).split(' ')[0];return (o.grade===s.grade?2:0)+(a&&b&&(a===b||a.includes(b)||b.includes(a))?3:0)+(o.gender===s.gender?1:0)}
function adLinkBox(s){const others=(A.list||[]).filter(o=>o.status!=='pending'&&o.role===s.role);if(!others.length)return '';
 const best=others.map(o=>[o,adSimilar(s,o)]).filter(x=>x[1]>=5).sort((a,b)=>b[1]-a[1])[0];
 const warn=best?`<p class="note" style="margin:0;color:#9a5b00">⚠️ قد يكون نفس ${s.role==='parent'?'ولي الأمر':'المنافس'}: <b>${esc(best[0].name)}</b>${s.role==='parent'?'':' · '+GRADES[best[0].grade]+' · '+best[0].score+' نقطة'}</p>`:'';
 if(A.lk!==s.id)return warn+`<button class="btn plain wide" data-adlk="${s.id}">🔗 دمج مع حساب موجود (غيّر جواله)</button>`;
 if(A.lkTo){const t=others.find(o=>o.id===A.lkTo);if(t)return `<div class="warn stack"><p style="margin:0">دمج هذا الطلب مع حساب <b>${esc(t.name)}</b>؟ يُحذف الطلب الجديد، ويدخل الجوال الجديد مباشرة إلى حسابه القديم بكل نقاطه، دون رابط.</p><div class="row"><button class="btn" data-adlkok="${s.id}">✓ نعم، ادمج</button><button class="btn plain" data-act="adLkCancel">إلغاء</button></div></div>`}
 return warn+`<div class="card stack" style="box-shadow:none;background:#F6F4FF"><b>اختر الحساب القديم لدمج هذا الطلب معه</b>
 <input type="text" id="adlkq" value="${esc(A.lkQ||'')}" placeholder="ابحث بالاسم…" style="width:100%">
 <div class="stack" id="adlklist">${adLkList(adLkCands(s),s)}</div><button class="btn plain" data-act="adLkCancel">إلغاء</button></div>`}
function adLkCands(s){const q=anorm(A.lkQ||'');return (A.list||[]).filter(o=>o.status!=='pending'&&o.role===s.role).map(o=>[o,adSimilar(s,o)]).filter(([o])=>!q||anorm(o.name).includes(q)).sort((a,b)=>b[1]-a[1]||a[0].name.localeCompare(b[0].name,'ar')).slice(0,12)}
function adLkList(list,s){return list.map(([o,sc])=>`<button class="tile" data-adlkto="${o.id}" style="padding:10px 12px"><span class="av ${o.gender}">${esc((o.name||'؟').trim()[0])}</span><span class="grow"><b>${esc(o.name)}</b>${sc>=5?' <span class="note" style="color:#9a5b00">⚠️ مشابه</span>':''}<br><span class="note">${s.role==='parent'?'ولي أمر':GRADES[o.grade]+' · '+o.score+' نقطة'}${o.last?' · آخر تدريب '+o.last:''}</span></span></button>`).join('')||'<p class="note" style="margin:0">لا يوجد حساب بهذا الاسم.</p>'}

 ${A.del===s.id?`<div class="warn stack">حذف حساب ولي الأمر ${esc(s.name)} نهائياً؟<div class="row"><button class="btn danger" data-addelok="${s.id}">نعم، احذف</button><button class="btn plain" data-act="adCancel">إلغاء</button></div></div>`:`<div class="row"><button class="x" style="color:var(--bad)" data-addel="${s.id}">حذف</button></div>`}</div>`}

 return `<div class="card stack" style="box-shadow:none"><div class="row between"><b>🔔 تنبيهات طلبات الانضمام</b>${on?'<span class="note" style="color:var(--th)">مفعّلة ✓</span>':''}</div>
 <p class="note" style="margin:0">عند وصول طلب جديد تسمع نغمة ويصلك إشعار ما دامت مِران مفتوحة عندك كمدير، ويصلك أيضاً بريد على ${esc(ADMIN_EMAIL)}.</p>

 <details><summary style="cursor:pointer;font-weight:700">📲 إشعار على جوالك حتى والتطبيق مغلق (مجاني)</summary><div class="stack" style="margin-top:8px">

 <div class="tklink" dir="ltr">${NTFY_TOPIC}</div><div class="row"><button class="btn plain grow" data-copy="${NTFY_TOPIC}">نسخ اسم القناة</button><button class="btn plain grow" data-act="adTestPush">إرسال تجربة</button></div>
 <p class="note" style="margin:0">لا تشارك اسم القناة مع أحد. الإشعار لا يذكر اسم الطالب حفاظاً على الخصوصية، والتفاصيل في لوحتك وفي البريد.</p></div></details></div>`}
function adFiltered(){const q=(view.q||'').trim().toLowerCase();return(A.list||[]).filter(s=>s.status!=='pending'&&s.role!=='parent').filter(s=>(A.st==='all'||stageOf(s.grade)===A.st)&&(!q||s.name.toLowerCase().includes(q)))}
function vAdmin(){let body;
 if(A.err)body=`<div class="warn stack">${esc(A.err)}<span class="note">تأكد أنك نشرت قواعد الحماية الجديدة في Firebase.</span><button class="btn plain" data-act="adReload">إعادة المحاولة</button></div>`;

  body=`<div class="stats"><div class="stat" style="--c:var(--home)"><b>${L.length}</b><span>منافس</span></div><div class="stat" style="--c:var(--en)"><b>${cnt('p')}</b><span>ابتدائي</span></div><div class="stat" style="--c:var(--th)"><b>${cnt('m')+cnt('s')}</b><span>متوسط وثانوي</span></div></div>
  ${A.old?`<div class="card stack"><h3>بيانات النظام القديم</h3><p class="note" style="margin:0">${A.old>0?`يوجد ${A.old} طالب مسجّل عن طريق أولياء الأمور.`:'توجد بيانات عائلات قديمة.'} انقلهم للنظام الجديد مع تقدّمهم، ثم أرسل لكل واحد رابط الدخول.</p><button class="btn" data-act="adMigrate">نقل الطلاب للنظام الجديد</button></div>`:''}
  ${PD.length?`<div class="card stack" style="background:#FFF6DB"><h3 style="margin:0">طلبات انضمام جديدة (${PD.length})</h3><p class="note" style="margin:0">لا يدخل المنافس أو ولي الأمر التطبيق حتى توافق عليه، وأولياء الأمور لا يظهرون في الترتيب أبداً.</p></div>${PD.map(adPendRow).join('')}`:''}

  <div class="seg">${sg('all','الكل')}${sg('p','ابتدائي')}${sg('m','متوسط')}${sg('s','ثانوي')}</div>
  <div class="stack" id="adlist">${adFiltered().map(adRow).join('')||'<div class="card">لا يوجد منافسون بعد.</div>'}</div>
  ${PR.length?`<details class="card"><summary style="cursor:pointer"><b>👨‍👩‍👧 أولياء الأمور (${PR.length})</b> <span class="note">للاطلاع فقط، لا يظهرون في الترتيب</span></summary><div class="stack" style="margin-top:10px">${PR.map(adParRow).join('')}</div></details>`:''}
  <button class="btn plain wide" data-act="adReload">تحديث القائمة</button>`}
 return startTop()+band('إدارة النظام','كل الطلاب في التطبيق: إضافة وتعديل وحذف وروابط الدخول.')+`<div class="sec">${body}<p class="note" style="margin:0">${esc((C.user&&C.user.email)||'')}</p><button class="btn plain wide" data-act="logoutOk">تسجيل الخروج</button></div>`}

 const rows=q?all.filter(r=>(r.nick||'').includes(q)):all;

const CONTR=[["i'm","i am"],["you're","you are"],["it's","it is"],["that's","that is"],["what's","what is"],["he's","he is"],["she's","she is"],["we're","we are"],["they're","they are"],["don't","do not"],["doesn't","does not"],["didn't","did not"],["can't","can not"],["cannot","can not"],["won't","will not"],["isn't","is not"],["aren't","are not"],["shouldn't","should not"],["i'd","i would"],["i'll","i will"],["we'll","we will"],["i've","i have"],["o'clock","o clock"],["let's","let us"]];
function tnorm(s){s=String(s||'').toLowerCase().replace(/[’`]/g,"'");CONTR.forEach(([a,b])=>{s=s.split(a).join(b)});return s.replace(/[^a-z0-9' ]+/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim()}
const tokEq=(w,k)=>w===k||(k.length>=3&&(w.startsWith(k)||w.endsWith(k)));
function thas(t,ph){const T=t.split(' '),P=ph.split(' ').filter(Boolean);if(!P.length)return false;for(let i=0;i+P.length<=T.length;i++){if(P.every((k,j)=>tokEq(T[i+j],k)))return true}return false}
const tvars=raw=>[tnorm(raw),tnorm(String(raw||'').replace(/['’]s\b/gi,' is'))];
function tmatch(raw,turn){return tvars(raw).some(t=>t&&turn[4].split('|').some(g=>g.split('+').every(ph=>thas(t,tnorm(ph)))))}
function tsim(raw,model){const m=tnorm(model).split(' ').filter(w=>w.length>1);if(!m.length)return 0;return Math.max(...tvars(raw).map(v=>{const set=new Set(v.split(' '));return m.filter(w=>set.has(w)).length/m.length}))}

 ${tutorCard()}<div class="chat">${log}</div>${ctl}</div>`}

function qSim(a,b){const x=QSKEL(a),y=QSKEL(b);if(!x&&!y)return 1;if(x===y)return 1;const L=Math.max(x.length,y.length);return 1-qLev(x,y)/L}

  <label class="f" for="rn-${i}">الاسم<input type="text" id="rn-${i}" class="rname" data-i="${i}" value="${esc(r.name)}" maxlength="20" placeholder="اكتب الاسم"></label>
  <div class="f stack"><b style="font-size:14px">الجنس</b>${segH('gender',[['m','ذكر'],['f','أنثى']],r.gender,`data-i="${i}"`)}</div>
  <div class="f stack"><b style="font-size:14px">الصف</b>${gradeSeg('data-rset',r.grade,`data-i="${i}"`)}<span class="note">${GRADES[r.grade]||''}</span></div>
  <div class="f stack"><b style="font-size:14px">الفصل الدراسي</b>${segH('term',[[1,'الأول'],[2,'الثاني']],r.term,`data-i="${i}"`)}</div>
  ${false?`<label class="f" for="rp-${i}">رقم سري (اختياري، يُنشأ تلقائياً)<input type="tel" inputmode="numeric" maxlength="4" placeholder="تلقائي" id="rp-${i}" class="rpin" data-i="${i}" value="${esc(r.pin||'')}" dir="ltr" style="text-align:center;letter-spacing:.4em"></label>`:''}</div>`).join('')}
 <button type="button" class="btn ghost wide" data-act="addRow">إضافة اسم آخر</button>
 <p class="warn" id="serr" hidden>اكتب الاسم في كل خانة، أو احذف الخانة الفارغة.</p>
 <button class="btn wide" type="submit">حفظ والبدء</button>
 ${S.profiles.length?`<button type="button" class="btn plain wide" data-act="formBack">إلغاء</button>`:''}${CLOUD&&!S.profiles.length?`<button type="button" class="btn plain wide" data-act="logout">تسجيل الخروج</button>`:''}</form>`}
function syncRows(){document.querySelectorAll('.rname').forEach(el=>{const r=view.rows[+el.dataset.i];if(r)r.name=el.value});document.querySelectorAll('.rpin').forEach(el=>{const r=view.rows[+el.dataset.i];if(r)r.pin=el.value.trim()})}
function vForm(){const f=view.f;const seg=(key,opts)=>`<div class="seg" role="radiogroup">${opts.map(([v,l])=>`<button type="button" class="${f[key]===v?'on':''}" data-set="${key}" data-v="${v}" role="radio" aria-checked="${f[key]===v}">${l}</button>`).join('')}</div>`;
 return header()+`<div class="qhead"><h1>${view.editId?'تعديل الملف':'ملف جديد'}</h1><button class="x" data-act="formBack">رجوع</button></div>
 <form class="sec" id="pform"><label class="f" for="pname">الاسم<input type="text" id="pname" value="${esc(f.name)}" maxlength="20" placeholder="مثال: عبدالله" required></label>
 <div class="f stack"><b style="font-size:14px">الجنس</b>${seg('gender',[['m','ذكر'],['f','أنثى']])}<span class="note">يغيّر صيغة الخطاب والألوان داخل التطبيق.</span></div>
 <div class="f stack"><b style="font-size:14px">الصف</b>${gradeSeg('data-set',f.grade)}<span class="note">${GRADES[f.grade]||''}</span></div>
 <div class="f stack"><b style="font-size:14px">الفصل الدراسي</b>${seg('term',[[1,'الأول'],[2,'الثاني']])}<span class="note">تظهر مفردات الإنجليزي الخاصة بهذا الفصل وما قبله.</span></div>
 <p class="warn" id="ferr" hidden>اكتب الاسم أولاً.</p>
 <button class="btn wide" type="submit">حفظ</button></form>`}

function secOf(){const n=view.name;if(['en','flash','hard','readList','talkList','talkRun'].includes(n))return 'en';if(n==='qd'||n==='mist')return(lastQtab==='t'||lastQtab==='thl')?'th':'qd';if((n==='quiz'||n==='result')&&view.q&&view.q.items[0])return view.q.items[0].sec;if(n==='comp')return 'cp';return ''}
function band(t,sub){return `<div class="band"><h1>${t}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>`}
const AUTHV=['start','plogin','loading'];
function render(){if(CLOUD){if(!C.ready&&view.name!=='loading')view={name:'loading'};else if(C.ready&&!C.user&&!['start','plogin'].includes(view.name))view={name:'start'};else if(C.ready&&C.mode==='admin'&&!ADMV.includes(view.name))view={name:'admin'};else if(C.ready&&C.mode==='student'&&S.profiles.length&&cur()&&cur().status==='pending'&&!C.asAdmin)view={name:'wait'};else if(C.ready&&C.mode==='student'&&!S.profiles.length&&!['start','loading','plogin'].includes(view.name))view={name:'start'};else if(C.ready&&C.mode==='student'&&isPar()&&!['pboard','who','wait'].includes(view.name))view={name:'pboard'}}
 const p=cur();document.body.dataset.sec=secOf();if(!CLOUD&&!AUTHV.includes(view.name)&&!S.profiles.length&&view.name!=='setup'){view={name:'setup',rows:[{name:'',gender:'m',grade:1,term:1}]}}
 document.body.dataset.g=(view.name==='form'?view.f.gender:view.name==='setup'?'m':(p?p.gender:'m'));
 const map={pboard:vPBoard,talkList:vTalkList,quran:vQuran,quranRun:vQuranRun,wait:vWait,talkRun:vTalkRun,admin:vAdmin,adBoard:vAdBoard,start:vStart,plogin:vPlogin,loading:vLoading,who:vWho,home:vHome,en:vEn,qd:vQd,flash:vFlash,readList:vReadList,hard:vHard,mist:vMist,quiz:vQuiz,result:vResult,parent:vParent,form:vForm,setup:vSetup,comp:vComp};
 app.innerHTML=(map[view.name]||vWho)();
 const nav=$('#nav');nav.hidden=true||!p||['who','form','quiz','setup','talkRun',...AUTHV,...ADMV].includes(view.name);document.body.classList.toggle('has-nav',!nav.hidden);
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.go===view.name||(b.dataset.go==='en'&&['flash','readList','hard','talkList','talkRun'].includes(view.name))||(b.dataset.go==='qd'&&view.name==='mist')));
 if(view.name==='quiz'){const it=view.q.items[view.q.i];if(!it.shownAt)it.shownAt=Date.now();if(it.autoSpeak&&view.q.res[view.q.i]==null&&!it._spoken){it._spoken=true;setTimeout(()=>speak(it.speak),250)}tickTimer()}
 if(view.name==='home'&&CLOUD&&p){subscribeBoard();renderBoard()}
 if(view.name==='comp'){subscribeBoard();renderBoard();}
 bindAuthForms();const tkf=$('#tkform');if(tkf)tkf.addEventListener('submit',e=>{e.preventDefault();const v=$('#tkin').value.trim();if(!v)return;tkEval([v])});bindAdmin();if(view.name==='admin'&&C.user&&!A.list&&!A.loading&&!A.err)adminLoad();
 const sf=$('#sform');if(sf)sf.addEventListener('submit',e=>{e.preventDefault();syncRows();if(view.rows.some(r=>!r.name.trim())){$('#serr').hidden=false;return}
  view.rows.forEach(r=>S.profiles.push(newP(r.name.trim(),r.gender,r.grade,r.term)));save();go('who')});
 const f=$('#pform');if(f)f.addEventListener('submit',e=>{e.preventDefault();const nm=$('#pname').value.trim();if(!nm){$('#ferr').hidden=false;return}view.f.name=nm;
  if(CLOUD&&view.editId){const q=cur();const old=q.name;Object.assign(q,{name:nm,gender:view.f.gender,grade:view.f.grade,term:view.f.term});if(q.nick===old)q.nick=nm;Object.keys(q.daily).forEach(k=>{if(q.daily[k])delete q.daily[k].words});stuRef(q.id).set(stuDoc(q)).catch(()=>{});pushAll(true);go('who');return}
  if(view.editId){const q=S.profiles.find(x=>x.id===view.editId);Object.assign(q,{name:nm,gender:view.f.gender,grade:view.f.grade,term:view.f.term});Object.keys(q.daily).forEach(k=>{if(q.daily[k])delete q.daily[k].words})}
  else{const q=newP(nm,view.f.gender,view.f.grade,view.f.term);S.profiles.push(q);if(!S.active&&view.back==='who'){}}
  save();go(view.back||'parent')});
}


/* ============ تشغيل الاختبارات ============ */
function startQuiz(o){const Q=Object.assign({i:0,res:[],mode:'practice',back:'home'},o);if(Q.sections){Q.secIdx=0;Q.usedAcc=0;Q.secStart=Date.now();Q.endAt=Date.now()+Q.sections[0].secs*1000}else if(Q.secs){Q.endAt=Date.now()+Q.secs*1000;Q.start=Date.now()}go('quiz',{q:Q})}
function endSection(){const Q=view.q;const sc=Q.sections[Q.secIdx];Q.usedAcc+=Math.min(sc.secs,Math.round((Date.now()-Q.secStart)/1000));if(Q.secIdx>=Q.sections.length-1){Q.secStart=null;return finishQuiz()}Q.secIdx++;Q.i=Q.sections[Q.secIdx].start;Q.pause=true;Q.endAt=null;render();window.scrollTo(0,0)}
function mixedQd(p,n){const cats=shuf(qcats(p.grade));const out=[];for(let i=0;i<n;i++){const c=cats[i%cats.length];out.push(genQ(c,level(p,c)))}return shuf(out)}
function finishQuiz(){const Q=view.q;const p=cur();if(Q.sections){Q.used=Q.usedAcc+(Q.secStart&&!Q.pause?Math.min(Q.sections[Q.secIdx].secs,Math.round((Date.now()-Q.secStart)/1000)):0);Q.secStart=null}else if(Q.start)Q.used=Math.min(Q.secs,Math.round((Date.now()-Q.start)/1000));Q.endAt=null;
 const ok=Q.res.filter((x,k)=>x===Q.items[k].a).length;
 if(Q.mode==='exam'){p.exams=(p.exams||0)+1;lg(p).ex++}
 if(Q.mode==='speed'&&ok>p.speedBest)p.speedBest=ok;
 if(PLAN.some(x=>x.k===Q.kind)){const pl=planOf(p);if(!pl[Q.kind]){pl[Q.kind]=1;if(planStep(p)<0){lg(p).pl=1}}}
 if(Q.kind==='daily'||Q.kind==='enDay'){const k=dkey();const d=p.daily[k]||(p.daily[k]={});if(!d.done){d.done=true;p.points+=20;lg(p).dc=1}Q.items.forEach((it,j)=>{if(Q.res[j]===it.a&&it.word)p.learned[it.word.w]=true})}
 save();go('result',{q:Q})}
function answer(k){const Q=view.q;const it=Q.items[Q.i];if(Q.res[Q.i]!=null&&Q.mode!=='exam')return;const dt=it.shownAt?Date.now()-it.shownAt:null;
 if(Q.mode==='exam'){if(Q.res[Q.i]==null)record(it,k===it.a,Q.mode,dt);Q.res[Q.i]=k;if(Q.sections){if(Q.i<Q.sections[Q.secIdx].end-1){Q.i++;render()}else endSection();return}if(Q.i<Q.items.length-1){Q.i++;render()}else finishQuiz();return}
 Q.res[Q.i]=k;record(it,k===it.a,Q.mode,dt);
 if(Q.mode==='speed'){Q.items.push(speedQ(cur()));Q.i++;render();return}
 render()}
function tickTimer(){const Q=view.q;const el=$('#timer');if(!Q||!Q.endAt||!el)return;const left=Math.max(0,Math.round((Q.endAt-Date.now())/1000));el.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');el.classList.toggle('low',left<=(Q.mode==='speed'?10:60));if(left<=0){if(Q.sections)endSection();else finishQuiz()}}
function again(){const Q=view.q;const p=cur();const k=Q.kind;
 if(k==='cat')return startCat(Q.cat);if(['speed','exam','examMini','thExam','sciMix','nafes','enTrain','qTrain','tTrain','enDay'].includes(k))return act(k);
 if(k==='read')return startRead(Q.rk);act(k)}
function startRead(k){const r=RD[k];startQuiz({title:'القراءة والفهم',kind:'read',rk:k,back:'readList',items:r.qs.map(([q,c,a,ar])=>{const ch=c.map((x,j)=>({x,j}));const s=shuf(ch);return{cat:'reading',sec:'en',q:`<span class="en" dir="ltr" style="display:block;text-align:left">${esc(q)}</span>`,c:s.map(o=>esc(o.x)),chLtr:!ar,a:s.findIndex(o=>o.j===a),ex:['ارجع إلى القطعة وابحث عن الجملة التي تحمل الإجابة.'],passage:r}})})}

function act(a){const p=cur();if(cloudAct(a))return;
 switch(a){
 case 'switch':if(CLOUD&&C.mode==='student'){go('who');break}S.active=null;save();go('who');break;
 case 'add':go('setup',{rows:[{name:'',gender:'m',grade:1,term:1}],back:view.name==='who'?'who':'parent'});break;
 case 'addRow':syncRows();view.rows.push({name:'',gender:'m',grade:1,term:1});render();break;
 case 'parentFromWho':go('parent');break;
 case 'formBack':go(view.back||(cur()?'parent':'who'));break;
 case 'planNext':{const st=planStep(p);if(st<0){go('home');break}act(PLAN[st].k);break}
 case 'talk':go('talkList');break;
 case 'tkList':TK=null;go('talkList');break;
 case 'tkQuit':try{REC&&REC.abort()}catch(e){}try{speechSynthesis.cancel()}catch(e){}TK=null;go('talkList');break;
 case 'tkMic':tkListen();break;
 case 'tkType':TK.typing=true;render();setTimeout(()=>{const i=$('#tkin');if(i)i.focus()},50);break;
 case 'tkMicMode':TK.typing=false;render();break;
 case 'tkNext':tkNext();break;
 case 'tkFree':startFree();break;
 case 'qWird':qWird();break;
 case 'qPlay':qPlay(Q.i);break;
 case 'qMic':qListen();break;
 case 'qLater':{const q=cur();q.qPrompt=dkey();save();render();break}
 case 'qHint':Q.hint=Q.i;render();break;
 case 'qSkip':if(Q.i<Q.vs.length-1){Q.i++;Q.fin='';render()}else{Q.done=true;qStopFlow(false);qAdvance(cur());save();render()}break;
 case 'tkEndFree':try{REC&&REC.abort()}catch(e){}if(TK){TK.done=true;if(TK.i>0)tkFinish();render();tkScroll()}break;
 case 'tkShow':tkShow();break;
 case 'enTrain':startQuiz({title:'تدريب الإنجليزي',kind:'enTrain',back:'en',items:enTrainItems(p)});break;
 case 'goQ':lastQtab='q';go('qd');break;
 case 'goT':lastQtab='t';go('qd');break;
 case 'qTrain':lastQtab='q';startQuiz({title:'تدريب القدرات',kind:'qTrain',back:'qd',items:qTrainItems(p)});break;
 case 'tTrain':lastQtab='t';startQuiz({title:'تدريب التحصيلي',kind:'tTrain',back:'qd',items:tTrainItems(p)});break;
 case 'daily':go('flash',{words:dailyWords(p),i:0});break;
 case 'fnext':if(view.i<view.words.length-1){view.i++;render()}else startQuiz({title:'الإنجليزي',kind:'enDay',back:'home',items:enDayItems(p,view.words)});break;
 case 'enDay':go('flash',{words:dailyWords(p),i:0});break;
 case 'fprev':view.i--;render();break;
 case 'vocab':startQuiz({title:'اختبار المفردات',kind:'vocab',back:'en',items:weightedWords(p,8).map((w,j)=>vocabItem(w,p,j%2))});break;
 case 'grammar':{let pool=nearSort(GR,p.grade,x=>x.g).slice(0,12);
  startQuiz({title:'القواعد',kind:'grammar',back:'en',items:shuf(pool).slice(0,10).map(x=>{const ch=shuf(x.c.map((t,j)=>({t,j})));return{cat:'grammar',sec:'en',q:'اختر الإجابة الصحيحة:',ltr:x.q,c:ch.map(o=>esc(o.t)),chLtr:true,a:ch.findIndex(o=>o.j===x.a),ex:[x.ex]}})});break}
 case 'readList':go('readList');break;
 case 'listen':if(!canSpeak){go('en');return}startQuiz({title:'الاستماع',kind:'listen',back:'en',items:weightedWords(p,6).map(w=>listenItem(w,p))});break;
 case 'hard':go('hard');break;
 case 'hardQuiz':{const ws=gradeWords(p).filter(x=>p.hard[x.w]);startQuiz({title:'مراجعة الكلمات الصعبة',kind:'hardQuiz',back:'hard',items:shuf(ws).slice(0,8).map((w,j)=>vocabItem(w,p,j%2))});break}
 case 'mist':go('mist');break;
 case 'mistQuiz':startQuiz({title:'إعادة حل الأخطاء',kind:'mistQuiz',mode:'mist',back:'mist',items:mistOf(p).slice(0,10).map(x=>Object.assign({sec:isThM(x)?'th':'qd'},x))});break;
 case 'exam':lastQtab='q';startQuiz(Object.assign({title:'اختبار القدرات المحاكي',kind:'exam',mode:'exam',back:'qd'},buildQudurat(p,4,12)));break;
 case 'examMini':startQuiz(Object.assign({title:'نموذج قدرات مصغّر',kind:'examMini',mode:'exam',back:'qd'},buildQudurat(p,2,8)));break;
 case 'nextSec':{const Q=view.q;Q.pause=false;Q.secStart=Date.now();Q.endAt=Date.now()+Q.sections[Q.secIdx].secs*1000;render();break}
 case 'thExam':lastQtab='t';startQuiz(Object.assign({title:'اختبار تحصيلي محاكي',kind:'thExam',mode:'exam',back:'qd'},buildTahsili(p,5)));break;
 case 'sciMix':startQuiz({title:'مراجعة علوم منوّعة',kind:'sciMix',back:'qd',items:sciItems(p,['phy','chem','bio','earth'],10)});break;
 case 'nafes':startQuiz({title:'تهيئة نافس',kind:'nafes',back:'qd',items:shuf([genTM(p.grade),genTM(p.grade)].concat(mixedQd(p,2),sciItems(p,['phy','chem','bio','earth'],3))).concat(verbalItems(p,'rc'))});break;
 case 'speed':startQuiz({title:'تمرين السرعة',kind:'speed',mode:'speed',back:'qd',secs:60,items:[speedQ(p)]});break;
 case 'next':if(view.q.i<view.q.items.length-1){view.q.i++;render();window.scrollTo(0,0)}else finishQuiz();break;
 case 'quit':{const Q=view.q;if(Q.res.filter(x=>x!=null).length&&Q.mode!=='mist'&&Q.mode!=='practice')finishQuiz();else if(Q.res.some(x=>x!=null)){finishQuiz()}else go(Q.back)}break;
 case 'again':again();break;
 case 'delno':view.del=null;render();break;
 }}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(cloudClick(d))return;
 if(d.say){speak(d.say);return}
 if(d.copy){const t=d.copy;try{navigator.clipboard.writeText(t).then(()=>toast(t.length>24?'تم نسخ الرابط':'تم النسخ: '+t),()=>toast(t))}catch(e){toast(t)}return}
 if(d.talk){startTalk(d.talk);return}
 if(d.qmode){Q.hafiz=d.qmode==='hafiz';Q.hint=null;render();return}
 if(d.qsurah){qPickSurah(+d.qsurah);return}
 if(d.tkfirst){const q=cur();q.talkFirst=d.tkfirst;save();render();return}
 if(d.tktr){const a=b.closest('.bub').querySelector('.bubar');if(a)a.hidden=!a.hidden;return}
 if(d.go){if(view.name==='quiz'&&view.q)view.q.endAt=null;go(d.go);return}
 if(d.pick){S.active=d.pick;save();go('home');return}
 if(d.cat){startCat(d.cat);return}
 if(d.qtab){lastQtab=d.qtab;view.tab=d.qtab;render();return}
 if(d.ch!=null){const Q=view.q,it=Q&&Q.items[Q.i];if(it&&Q.mode!=='speed'&&it.sec==='en'){const t=b.querySelector('.t');if(it.chLtr&&t)speak(t.textContent);else if(it.word)speak(it.word.w)}answer(+d.ch);return}
 if(d.read!=null){startRead(+d.read);return}
 if(d.bs){view.bs=d.bs;render();return}

 if(d.rset){syncRows();const r=view.rows[+d.i];r[d.rset]=d.rset==='gender'?d.v:+d.v;render();return}
 if(d.rdel!=null){syncRows();view.rows.splice(+d.rdel,1);render();return}
 if(d.set){const v=d.set==='gender'?d.v:+d.v;view.f[d.set]=v;const nm=$('#pname');if(nm)view.f.name=nm.value;render();return}
 if(d.edit){const q=S.profiles.find(x=>x.id===d.edit);go('form',{f:{name:q.name,gender:q.gender,grade:q.grade,term:q.term},editId:q.id,back:'parent'});return}
 if(d.del){view.del=d.del;render();return}
 if(d.delok){S.profiles.forEach(p=>{if(!p.gv){p.grade=Math.min(12,(+p.grade||1)+6);p.gv=2}if(p.term>2)p.term=2;p.log=p.log||{};p.stats.th=p.stats.th||{};p.online=true;p.nick=p.name;if(p.group==null)p.group=''});
 S.profiles=S.profiles.filter(x=>x.id!==d.delok);if(S.active===d.delok)S.active=null;save();view.del=null;go(cur()?'parent':(S.profiles.length?'who':'setup'),S.profiles.length?{}:{rows:[{name:'',gender:'m',grade:1,term:1}]});return}
 if(d.act)act(d.act)});

/* وقت التدريب */
let lastSave=0;
setInterval(()=>{if(view.name==='quiz')tickTimer();const p=cur();if(!p||document.hidden)return;if(!['quiz','flash','readList','hard','mist','talkRun'].includes(view.name))return;const k=dkey();p.secs++;p.daySecs[k]=(p.daySecs[k]||0)+1;lg(p,k).s++;if(Date.now()-lastSave>(CLOUD?30000:15000)){lastSave=Date.now();save()}},1000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});

document.documentElement.lang='ar';
load();
loadPack();
fbStart();
go(cur()?'home':'who');
</script>

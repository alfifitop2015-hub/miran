<style>
:root{
  --paper:#F6F3EA;--card:#FFFFFF;--ink:#16241F;--muted:#5D6B65;--line:#E4DFD0;
  --green:#0B4D3A;--green2:#14785C;--gold:#C9962B;--goldbg:#FBF1D9;
  --ok:#15803D;--okbg:#DCF5E5;--warn:#B45309;--warnbg:#FDEBD3;--bad:#C2410C;--badbg:#FDE2D6;
  --acc:var(--green);--onacc:#FFFFFF;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.75;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 40px}
header.top{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
header.top img{width:46px;height:46px;border-radius:13px;box-shadow:var(--sh)}
header.top h1{font-family:var(--fd);font-size:26px;margin:0;line-height:1.2;color:var(--green)}
header.top p{margin:0;color:var(--muted);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.card h2{font-family:var(--fd);font-size:19px;margin:0 0 10px;color:var(--green);font-weight:600}
.card h3{font-size:16px;margin:0 0 8px}
.hero{background:linear-gradient(135deg,#0B4D3A,#14785C);color:#fff;border:none;position:relative;overflow:hidden}
.hero h2{color:#fff;font-size:22px}
.hero p{margin:0 0 4px;opacity:.92}
.hero::after{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;border:28px solid rgba(232,190,92,.25)}

.bigbtn{border:none;border-radius:16px;padding:16px 12px;background:#fff;color:#0B4D3A;font-weight:700;font-size:16.5px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.bigbtn.gold{background:#E8BE5C;color:#3A2A05}
.bigbtn svg{width:30px;height:30px}
.bigbtn small{font-weight:500;font-size:12.5px;opacity:.8}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}

.muted{color:var(--muted)}
.small{font-size:13.5px}
.btn{border:none;background:var(--acc);color:var(--onacc);border-radius:12px;padding:11px 18px;font-weight:700;font-size:15.5px;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink);font-weight:600}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}
/* recording */

@keyframes blink{50%{opacity:.25}}
canvas.viz{width:100%;height:120px;display:block;margin:12px 0}
.hint{background:var(--goldbg);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:10px}

.steps{list-style:none;padding:0;margin:10px 0}

.steps li .ic{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px}
.steps li.on{color:var(--ink);font-weight:600}
.steps li.on .ic{border-color:var(--acc);border-top-color:transparent;animation:spin .9s linear infinite}
.steps li.done{color:var(--ink)}
.steps li.done .ic{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}

.score-info{flex:1;min-width:220px}

.stat em{font-style:normal;font-size:12.5px;font-weight:600}
ul.list{margin:0;padding-inline-start:20px}
ul.list li{margin:4px 0}
.imp{border-inline-start:4px solid var(--gold);background:var(--paper);border-radius:10px;padding:10px 12px;margin:8px 0}
.imp b{display:block}
.imp .ex{font-size:14px;color:var(--muted)}
.imp .sg{font-size:14.5px;margin-top:4px}
table.ln{width:100%;border-collapse:collapse;font-size:14.5px}

table.ln th{font-size:13px;color:var(--muted);font-weight:600}
.said{color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.better{color:var(--ok);font-weight:600}
.quote{font-family:var(--fq);font-size:21px;line-height:1.9;background:var(--goldbg);border-radius:14px;padding:12px 16px;margin:0}
.quote::before{content:"«"}.quote::after{content:"»"}
.fill{display:inline-flex;gap:6px;align-items:center;background:var(--warnbg);color:var(--warn);border-radius:999px;padding:3px 12px;margin:3px;font-weight:600;font-size:14px}
details.tr summary{cursor:pointer;font-weight:600;color:var(--green)}

.hist-item{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;background:none;border-inline:none;border-bottom:none;width:100%;text-align:start}
.hist-item:first-child{border-top:none}
.hist-item .sc{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-family:var(--fd);font-size:19px;flex:none}
.hist-item .tt{flex:1;min-width:0}
.hist-item .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err{background:var(--badbg);color:var(--bad);border-radius:12px;padding:12px 14px;font-weight:600}
audio{width:100%;margin-top:6px}
footer.credit{text-align:center;color:var(--muted);font-size:12.5px;padding:18px 10px 8px}
.weights{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:14px}
.weights span:nth-child(even){font-weight:700;color:var(--green)}
@media (max-width:420px){.big-actions{grid-template-columns:1fr}.rec-timer{font-size:46px}}
@media print{
  body{background:#fff;color:#000}
  .noprint,footer.credit button{display:none!important}
  .card{box-shadow:none;break-inside:avoid;border-color:#ccc}
  .trtext{max-height:none}
  details.tr:not([open]){display:none}
}

<script>
'use strict';
/* =================== الإعدادات =================== */
const MAX_MIN=60, MIN_SEC=8;
const KINDS=['محاضرة أو درس','كلمة أو خطبة','تعليق أو رأي','عرض تقديمي','محادثة أو مقابلة','أخرى'];
const CRIT=[
 ['content','صحة الطرح والمحتوى',20],

 ['tone','نبرة الصوت والتلوين الصوتي',10],
 ['pace','سرعة الإلقاء والوقفات',10],
 ['fluency','الطلاقة وقلة الحشو',10],
 ['impact','التأثير والإقناع',10]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const aStr=v=>typeof v==='string'?v.trim():'';
const arr=v=>Array.isArray(v)?v:[];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const toAr=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const fmtDur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const durWords=s=>{s=Math.round(s);if(s<60)return toAr(s)+' ثانية';const m=Math.floor(s/60),x=s%60;return toAr(m)+' دقيقة'+(x?' و'+toAr(x)+' ثانية':'')};
function level(sc){return sc>=90?['متميّز','#0E7C4A','#D8F3E3']:sc>=80?['ممتاز','#15803D','#DCF5E5']:sc>=70?['جيد جدًا','#4D7C0F','#ECF7D4']:sc>=60?['جيد','#A16207','#FBF1D9']:sc>=50?['مقبول','#C2410C','#FDEBD3']:['يحتاج إلى تطوير','#B91C1C','#FDE2E2']}
function pctColor(p){return p>=.85?'#15803D':p>=.7?'#4D7C0F':p>=.55?'#C9962B':p>=.4?'#C2410C':'#B91C1C'}

/* =================== الحالة والتخزين =================== */
const LS='bayan.v1';

try{Object.assign(store,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(store))}catch(e){}};
let job=null;   // آخر تسجيل قيد المعالجة (للإعادة)
let view='home';

/* =================== الذكاء الاصطناعي (Firebase AI Logic + Gemini) =================== */
const FB={apiKey:"AIzaSyDfDRNr06QJKPShAvjuc0UOaFYNlvU5NEo",authDomain:"miran-7ad31.firebaseapp.com",projectId:"miran-7ad31",storageBucket:"miran-7ad31.firebasestorage.app",messagingSenderId:"1089204486985",appId:"1:1089204486985:web:986b4a4ad56190c878d098"};
const AI_SDK='https://www.gstatic.com/firebasejs/12.19.0/';
const AI_MODELS=['gemini-3.8-flash','gemini-flash-latest','gemini-2.5-flash'];
const APPCHECK_SITE_KEY='6LfGiOstAAAAAESfhLqvBOgqQsv6KE9K5QXQl-CE';
let aiPromise=null;
function aiInit(){
 if(location.protocol==='file:')return Promise.reject(new Error('افتح الصفحة من رابط الموقع وليس من ملف محلي.'));
 if(!aiPromise)aiPromise=(async()=>{
  const [{initializeApp},AI]=await Promise.all([import(AI_SDK+'firebase-app.js'),import(AI_SDK+'firebase-ai.js')]);
  const app=initializeApp(FB,'bayan-ai');
  if(APPCHECK_SITE_KEY){const AC=await import(AI_SDK+'firebase-app-check.js');const ac=AC.initializeAppCheck(app,{provider:new AC.ReCaptchaEnterpriseProvider(APPCHECK_SITE_KEY),isTokenAutoRefreshEnabled:true});AC.getToken(ac).catch(()=>{})}
  return {ai:AI.getAI(app,{backend:new AI.GoogleAIBackend()}),getGenerativeModel:AI.getGenerativeModel}})().catch(e=>{aiPromise=null;throw e});

// الإرسال بالبث (stream) حتى لا ينقطع الاتصال في التسجيلات الطويلة، مع مهلة كافية
async function aiEvaluate(prompt,b64,mime,timeoutMs,span,onText){
 const k=await aiInit();let lastErr=null,think=true;
 for(let i=0;i<AI_MODELS.length;){
  try{
   const gc={responseMimeType:'application/json',temperature:0.25,maxOutputTokens:12000};
   if(think)gc.thinkingConfig={thinkingBudget:span>480?0:1024};
   const model=k.getGenerativeModel(k.ai,{model:AI_MODELS[i],generationConfig:gc},{timeout:timeoutMs});
   const run=(async()=>{
    const r=await model.generateContentStream([{inlineData:{data:b64,mimeType:mime}},{text:prompt}]);
    let t='';for await(const ch of r.stream){try{t+=ch.text()}catch(e){}onText&&onText(t.length)}
    if(!t.trim()){try{t=(await r.response).text()}catch(e){}}
    return t})();
   const t=await Promise.race([run,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),timeoutMs+20000))]);
   return JSON.parse(String(t).trim().replace(/^```(json)?/,'').replace(/```$/,''));
  }catch(e){lastErr=e;const m=String((e&&(e.message||e.code))||e);
   if(think&&/thinking|budget|invalid.?argument/i.test(m)){think=false;continue}
   if(/not.?found|404|unsupported|is not supported/i.test(m)){i++;continue}
   if(/JSON|Unexpected (token|end)|Unterminated|Expected/i.test(m)&&i<AI_MODELS.length-1){i++;continue}
   break}}
 throw lastErr||new Error('ai')}

/* =================== معالجة الصوت =================== */
async function decodeAudio(buf){
 const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
 const ctx=new OAC(1,16000,16000);
 const ab=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)});
 const n=ab.length,ch=ab.numberOfChannels;let out;
 if(ch===1)out=new Float32Array(ab.getChannelData(0));
 else{out=new Float32Array(n);for(let c=0;c<ch;c++){const d=ab.getChannelData(c);for(let i=0;i<n;i++)out[i]+=d[i]/ch}}
 if(ab.sampleRate!==16000){ // احتياط: إعادة تشكيل بسيطة
  const r=ab.sampleRate/16000,m=Math.floor(n/r),o=new Float32Array(m);for(let i=0;i<m;i++)o[i]=out[Math.floor(i*r)];out=o}
 return out}

/* =================== تقليل حجم الفيديوهات الكبيرة تلقائيًا ===================
   نقرأ مسار الصوت فقط من داخل الفيديو (دون تحميل الفيديو كاملًا في الذاكرة)،
   ونحوّله مباشرة إلى صوت أحادي 16 كيلوهرتز، ثم يُضغط MP3 صغير قبل الإرسال. */
const fmtMB=b=>b>=1024*1024*1024?toAr((b/1024/1024/1024).toFixed(1))+' جيجابايت':b>=1024*1024?toAr((b/1024/1024).toFixed(b<10*1024*1024?1:0))+' ميجابايت':toAr(Math.max(1,Math.round(b/1024)))+' كيلوبايت';
class Down16{ // تحويل تدريجي لأي معدل عيّنات إلى 16 كيلوهرتز مع مرشح يمنع التشويه
 constructor(inRate,maxSec){this.r=inRate/16000;this.out=new Float32Array(Math.ceil(maxSec*16000)+16000);this.n=0;this.pos=0;this.base=0;this.prev=0;this.full=false;
  this.f=[];if(inRate>17000){const fc=Math.min(7000,inRate*0.43),w=2*Math.PI*fc/inRate,c=Math.cos(w),al=Math.sin(w)/(2*0.7071),a0=1+al;
   const co={b0:(1-c)/2/a0,b1:(1-c)/a0,b2:(1-c)/2/a0,a1:-2*c/a0,a2:(1-al)/a0};this.f=[{...co,x1:0,x2:0,y1:0,y2:0},{...co,x1:0,x2:0,y1:0,y2:0}]}}
 push(x){if(this.full||!x.length)return;
  for(const s of this.f){for(let i=0;i<x.length;i++){const v=x[i],y=s.b0*v+s.b1*s.x1+s.b2*s.x2-s.a1*s.y1-s.a2*s.y2;s.x2=s.x1;s.x1=v;s.y2=s.y1;s.y1=y;x[i]=y}}
  const L=x.length,o=this.out;
  while(true){const idx=this.pos-this.base,i=Math.floor(idx);if(i+1>=L)break;const fr=idx-i,a=i<0?this.prev:x[i];
   o[this.n++]=a+(x[i+1]-a)*fr;this.pos+=this.r;if(this.n>=o.length){this.full=true;break}}
  this.prev=x[L-1];this.base+=L}
 result(){return this.out.subarray(0,this.n)}}
function monoOf(ad){const n=ad.numberOfFrames,ch=ad.numberOfChannels,m=new Float32Array(n),tmp=new Float32Array(n);
 const planar=/planar/.test(ad.format);
 if(planar){for(let c=0;c<ch;c++){ad.copyTo(tmp,{planeIndex:c,format:'f32-planar'});for(let i=0;i<n;i++)m[i]+=tmp[i]/ch}}
 else{try{for(let c=0;c<ch;c++){ad.copyTo(tmp,{planeIndex:c,format:'f32-planar'});for(let i=0;i<n;i++)m[i]+=tmp[i]/ch}}
  catch(e){const all=new Float32Array(n*ch);ad.copyTo(all,{planeIndex:0,format:'f32'});for(let i=0;i<n;i++){let s=0;for(let c=0;c<ch;c++)s+=all[i*ch+c];m[i]=s/ch}}}
 return m}
const isMP4ish=f=>/\.(mp4|m4v|mov|m4a|3gp|3g2|qt)$/i.test(f.name||'')||/(mp4|quicktime|3gpp|m4a|x-m4a|aac)/i.test(f.type||'');
const isVideo=f=>/^video\//.test(f.type||'')||/\.(mp4|m4v|mov|3gp|3g2|webm|mkv|avi|qt)$/i.test(f.name||'');

// المسار السريع: MP4/MOV عبر mp4box + AudioDecoder (يقرأ بايتات الصوت فقط)
async function extractMP4(file,maxSec,onProg){
 if(!window.MP4Box||!window.AudioDecoder||!window.EncodedAudioChunk)throw new Error('unsupported');
 const mp=MP4Box.createFile();let info=null,perr=null;
 mp.onReady=i=>{info=i};mp.onError=e=>{perr=e};
 let off=0,guard=0;
 while(!info&&!perr&&off<file.size&&guard++<4000){
  const end=Math.min(file.size,off+2*1024*1024),ab=await file.slice(off,end).arrayBuffer();ab.fileStart=off;
  const nx=mp.appendBuffer(ab);off=(typeof nx==='number'&&nx>off)?nx:end}
 if(!info)throw new Error('unsupported');
 const tr=info.audioTracks&&info.audioTracks[0];if(!tr)throw new Error('noaudio');
 const trak=mp.getTrackById(tr.id),samples=trak.samples||[];if(!samples.length)throw new Error('unsupported');
 const ent=trak.mdia.minf.stbl.stsd.entries[0];let desc;
 try{const d=ent.esds.esd.descs[0].descs[0];if(d&&d.data)desc=new Uint8Array(d.data)}catch(e){}
 const sr=tr.audio.sample_rate,chn=tr.audio.channel_count;
 const cfg={codec:tr.codec==='mp4a'?'mp4a.40.2':tr.codec,sampleRate:sr,numberOfChannels:chn};if(desc)cfg.description=desc;
 const sup=await AudioDecoder.isConfigSupported(cfg).catch(()=>({supported:false}));if(!sup.supported)throw new Error('unsupported');
 const ts=samples[0].timescale,lastIdx=(()=>{let k=samples.length;for(let i=0;i<samples.length;i++)if(samples[i].cts/ts>maxSec){k=i;break}return k})();
 const totalSec=Math.min(maxSec,(samples[samples.length-1].cts+samples[samples.length-1].duration)/ts);
 let ds=null,derr=null;
 const dec=new AudioDecoder({output:ad=>{try{if(!ds)ds=new Down16(ad.sampleRate,totalSec+2);ds.push(monoOf(ad))}catch(e){derr=e}finally{ad.close()}},error:e=>{derr=e}});
 dec.configure(cfg);
 let i=0;
 while(i<lastIdx){
  if(derr)throw derr;
  // اجمع العيّنات المتجاورة في قراءة واحدة
  let j=i,start=samples[i].offset,end=start+samples[i].size;
  while(j+1<lastIdx&&samples[j+1].offset===end&&end-start<4*1024*1024){j++;end+=samples[j].size}
  const bytes=new Uint8Array(await file.slice(start,end).arrayBuffer());
  for(let k=i;k<=j;k++){const s=samples[k];
   dec.decode(new EncodedAudioChunk({type:'key',timestamp:Math.round(s.cts*1e6/ts),duration:Math.round(s.duration*1e6/ts),data:bytes.subarray(s.offset-start,s.offset-start+s.size)}))}
  i=j+1;onProg&&onProg(i/lastIdx);
  while(dec.decodeQueueSize>64)await new Promise(r=>setTimeout(r,5));
  await new Promise(r=>setTimeout(r,0))}
 await dec.flush();dec.close();if(derr)throw derr;
 if(!ds||!ds.n)throw new Error('noaudio');
 return {pcm:ds.result(),fullSec:(samples[samples.length-1].cts+samples[samples.length-1].duration)/ts}}

// احتياط أخير للملفات الضخمة بصيغ أخرى: تشغيل الصوت داخليًا بسرعة مضاعفة دون إسماعه وجمعه
async function extractByPlayback(file,maxSec,onProg){
 const AC=window.AudioContext||window.webkitAudioContext,ac=new AC();await ac.resume().catch(()=>{});
 const url=URL.createObjectURL(file),el=document.createElement(isVideo(file)?'video':'audio');
 el.src=url;el.preload='auto';el.playsInline=true;el.setAttribute('playsinline','');
 await new Promise((res,rej)=>{el.onloadedmetadata=res;el.onerror=()=>rej(new Error('decode'));setTimeout(()=>rej(new Error('decode')),20000)});
 const dur=Math.min(maxSec,el.duration||maxSec),rate=2;
 el.preservesPitch=false;el.mozPreservesPitch=false;el.webkitPreservesPitch=false;
 const srcN=ac.createMediaElementSource(el),sp=ac.createScriptProcessor(4096,1,1),mute=ac.createGain();mute.gain.value=0;
 const ds=new Down16(ac.sampleRate/rate,dur+2);
 sp.onaudioprocess=e=>{if(!el.paused)ds.push(new Float32Array(e.inputBuffer.getChannelData(0)))};
 srcN.connect(sp);sp.connect(mute);mute.connect(ac.destination);
 el.playbackRate=rate;
 try{await el.play()}catch(e){ac.close();URL.revokeObjectURL(url);throw new Error('decode')}
 await new Promise(res=>{const t=setInterval(()=>{onProg&&onProg(el.currentTime/dur);if(el.ended||el.currentTime>=dur||ds.full){clearInterval(t);res()}},300);el.onended=()=>{clearInterval(t);res()}});
 el.pause();try{sp.disconnect();srcN.disconnect()}catch(e){}ac.close();URL.revokeObjectURL(url);
 if(!ds.n)throw new Error('decode');
 return {pcm:ds.result(),fullSec:el.duration||dur}}

// يختار أفضل طريقة لقراءة الملف
async function loadAudio(file,onProg,onMode){
 const maxSec=MAX_MIN*60;
 if(isMP4ish(file)||isVideo(file)){
  try{onMode&&onMode('fast');return await extractMP4(file,maxSec,onProg)}
  catch(e){if(e&&e.message==='noaudio')throw new Error('الفيديو لا يحتوي على صوت.');console.warn('mp4 path',e)}}
 if(file.size<=250*1024*1024){
  onMode&&onMode('decode');
  try{const pcm=await decodeAudio(await file.arrayBuffer());const full=pcm.length/16000;return {pcm:full>maxSec?pcm.subarray(0,maxSec*16000):pcm,fullSec:full}}
  catch(e){console.warn('decode path',e)}}
 onMode&&onMode('play');
 try{return await extractByPlayback(file,maxSec,onProg)}
 catch(e){throw new Error('تعذّرت قراءة الملف. جرّب صيغة شائعة مثل MP4 أو MP3 أو M4A.')}}

// تحليل صوتي موضوعي: الصمت والوقفات وتنوّع النبرة ومستوى الصوت
function analyze(pcm){
 const SR=16000,F=480,nF=Math.floor(pcm.length/F),db=new Float32Array(nF);
 for(let f=0;f<nF;f++){let s=0;const o=f*F;for(let i=0;i<F;i++){const v=pcm[o+i];s+=v*v}db[f]=10*Math.log10(s/F+1e-10)}
 const sorted=Array.from(db).sort((a,b)=>a-b),q=p=>sorted[Math.min(sorted.length-1,Math.floor(p*sorted.length))];
 const floor=q(.1),top=q(.95),thr=Math.max(floor+6,floor+(top-floor)*.3);
 const voiced=new Uint8Array(nF);for(let f=0;f<nF;f++)voiced[f]=db[f]>thr?1:0;
 // سدّ الفجوات القصيرة جدًا (أقل من 0.15 ث)
 let first=voiced.indexOf(1),last=voiced.lastIndexOf(1);
 if(first<0)return {empty:true,dur:pcm.length/SR};
 const pauses=[];let run=0;
 for(let f=first;f<=last;f++){if(!voiced[f])run++;else{if(run*F/SR>=0.35)pauses.push(run*F/SR);run=0}}
 let vCount=0;for(let f=first;f<=last;f++)vCount+=voiced[f];
 const span=(last-first+1)*F/SR, speech=vCount*F/SR;
 // مستوى الصوت
 const vdb=[];for(let f=first;f<=last;f++)if(voiced[f])vdb.push(db[f]);
 const mean=vdb.reduce((a,b)=>a+b,0)/vdb.length, loudStd=Math.sqrt(vdb.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vdb.length);
 // النبرة: ارتباط ذاتي على 8 كيلوهرتز
 const vIdx=[];for(let f=first;f<=last;f++)if(voiced[f]&&db[f]>thr+3)vIdx.push(f);
 const step=Math.max(1,Math.floor(vIdx.length/5000)),pitches=[];
 const W=320,minL=20,maxL=106,buf=new Float32Array(W+maxL);
 for(let k=0;k<vIdx.length;k+=step){
  const o=vIdx[k]*F;if(o+2*(W+maxL)>=pcm.length)continue;
  let m=0;for(let i=0;i<W+maxL;i++){buf[i]=pcm[o+2*i];m+=buf[i]}m/=(W+maxL);for(let i=0;i<W+maxL;i++)buf[i]-=m;
  let e0=0;for(let i=0;i<W;i++)e0+=buf[i]*buf[i];if(e0<=0)continue;
  let best=0,bl=0;
  for(let L=minL;L<=maxL;L++){let c=0,e1=0;for(let i=0;i<W;i++){c+=buf[i]*buf[i+L];e1+=buf[i+L]*buf[i+L]}const r=c/Math.sqrt(e0*e1+1e-12);if(r>best){best=r;bl=L}}
  if(best>0.55&&bl>minL&&bl<maxL)pitches.push(8000/bl)}
 let pitchMed=0,pitchSt=0;
 if(pitches.length>20){const ps=pitches.slice().sort((a,b)=>a-b);pitchMed=ps[Math.floor(ps.length/2)];
  const st=pitches.map(p=>12*Math.log2(p/pitchMed)).filter(v=>Math.abs(v)<12);const sm=st.reduce((a,b)=>a+b,0)/st.length;
  pitchSt=Math.sqrt(st.reduce((a,b)=>a+(b-sm)*(b-sm),0)/st.length)}
 let peak=0;for(let i=0;i<pcm.length;i+=4){const a=Math.abs(pcm[i]);if(a>peak)peak=a}
 const longP=pauses.filter(p=>p>=2).length;
 return {dur:pcm.length/SR,span,speech,speakRatio:speech/span,pauses:pauses.length,longPauses:longP,
  avgPause:pauses.length?pauses.reduce((a,b)=>a+b,0)/pauses.length:0,pausesPerMin:pauses.length/(span/60),
  loudStd,loudMean:mean,pitchMed,pitchSt,quiet:mean<-42,clipped:peak>0.995,firstSec:first*F/SR,lastSec:(last+1)*F/SR}}

function trimPCM(pcm,st){const a=Math.max(0,Math.floor((st.firstSec-0.4)*16000)),b=Math.min(pcm.length,Math.ceil((st.lastSec+0.4)*16000));return pcm.subarray(a,b)}

async function encodeMP3(pcm,kbps,onProg){
 const enc=new lamejs.Mp3Encoder(1,16000,kbps),blk=1152*20,out=[];
 const i16=new Int16Array(blk);
 for(let o=0;o<pcm.length;o+=blk){
  const n=Math.min(blk,pcm.length-o);
  for(let i=0;i<n;i++){const s=clamp(pcm[o+i],-1,1);i16[i]=s<0?s*0x8000:s*0x7FFF}
  const b=enc.encodeBuffer(n===blk?i16:i16.subarray(0,n));if(b.length)out.push(new Uint8Array(b));
  if((o/blk)%40===0){onProg&&onProg(o/pcm.length);await new Promise(r=>setTimeout(r,0))}}
 const e=enc.flush();if(e.length)out.push(new Uint8Array(e));
 return new Blob(out,{type:'audio/mpeg'})}
const blobToB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});

function buildPrompt(meta,st){
 const longTalk=st.span>360;
 const pitchTxt=st.pitchSt?`انحراف طبقة الصوت المعياري ≈ ${st.pitchSt.toFixed(1)} نصف نغمة (أقل من 1.8 يدل على رتابة، 1.8–3 متوسط، أكثر من 3 تلوين حيوي)، متوسط الطبقة ≈ ${Math.round(st.pitchMed)} هرتز`:'تعذّر قياس طبقة الصوت آليًا';
 return `أنت خبير محكّم في فن الإلقاء والخطابة العربية، متخصص في العربية الفصحى واللهجة السعودية العامة بلهجاتها المحلية (النجدية والحجازية والجنوبية والشرقية والشمالية). استمع بعناية إلى التسجيل الصوتي المرفق وقيّم المتحدث تقييمًا مهنيًا دقيقًا منصفًا غير مجامل.

معلومات من المستخدم:
- نوع الكلام: ${meta.kind}
${meta.topic?`- الموضوع أو الهدف أو الجمهور: ${meta.topic}\n`:''}- مدة الكلام الفعلية: ${durWords(st.span)}${job&&job.sampled?`
- تنبيه: لأن الكلام طويل، المرفق ليس التسجيل كاملًا بل ثلاث عيّنات متتالية مدة كل منها 4 دقائق: من البداية ثم من الوسط ثم من النهاية، تفصل بينها ثانية صمت (ليست وقفة من المتحدث). قيّم الكلام كله بناءً عليها، واجعل word_count عدد كلمات العيّنات فقط، واترك transcript فارغًا.`:''}

قياسات صوتية آلية (استأنس بها مع ما تسمعه بنفسك، ولا تعتمد عليها وحدها):
- نسبة زمن الكلام إلى الصمت: ${Math.round(st.speakRatio*100)}٪
- عدد الوقفات (≥0.35 ث): ${st.pauses}، منها وقفات طويلة (≥2 ث): ${st.longPauses}، متوسط الوقفة ${st.avgPause.toFixed(2)} ث
- تفاوت مستوى ارتفاع الصوت: ${st.loudStd.toFixed(1)} ديسبل
- ${pitchTxt}

قواعد التقييم:
1. اللهجة السعودية ليست خطأ: إن تكلّم بالعامية فقيّم سلامة تعبيره ووضوحه ومناسبة المستوى اللغوي للمقام (فالمحاضرة الرسمية والخطبة يناسبهما الفصحى أو البيضاء أكثر، والتعليق والمحادثة تناسبهما العامية). إن تكلّم بالفصحى فدقّق في النحو والصرف وضبط أواخر الكلمات الظاهرة واختيار المفردات.
2. راعِ طول الكلام: الكلمة القصيرة (أقل من دقيقة) تُقاس بوضوح الفكرة وإحكامها وقوة الافتتاح والختام دون اشتراط مقدمة وعرض وخاتمة مطوّلة؛ والكلام الطويل يُقاس بالتنظيم وتسلسل المحاور والانتقالات والتلخيص والمحافظة على انتباه السامع.
3. صحة الطرح: تحقّق من صحة المعلومات والحقائق والأرقام والاستشهادات (الآيات والأحاديث والأقوال والأمثال) ومنطق الاستدلال. نبّه على أي خطأ واضح، ولا تخترع أخطاء.
4. نبرة الصوت: قيّم التلوين الصوتي (رفع وخفض في مواضعه)، والحماس والثقة، ومناسبة النبرة للمعنى والمقام، وتجنّب الرتابة أو الصراخ.
5. السرعة والوقفات: السرعة المريحة في العربية تقارب 100–140 كلمة في الدقيقة؛ والوقفات الجيدة تأتي بعد الأفكار وقبل المعاني المهمة، أما الوقفات المترددة وسط الجملة فعيب.
6. الطلاقة: لاحظ الحشو مثل (يعني، اممم، ااا، طيب، زي ما قلت، الشي هذا، كذا، والله) والتأتأة وإعادة الكلمات وتصحيح الجمل أثناء الكلام، وعدّ أبرز كلمات الحشو.
7. التأثير: الافتتاح الجاذب، والأمثلة والقصص والشواهد، ومخاطبة السامع، وقوة الختام، ووضوح الرسالة.
8. كن دقيقًا في الدرجات: 90 فأكثر لمتحدث متمكن جدًا يُحتذى به، و75–89 جيد إلى ممتاز، و60–74 متوسط، وأقل من ذلك ضعيف. اذكر أمثلة من كلام المتحدث نفسه.
9. إذا لم يكن في التسجيل كلام مفهوم، أو كان الكلام بغير العربية، أو كان موسيقى أو ضجيجًا فقط، فاجعل valid=false واذكر السبب.

let REC=null;
async function startRec(){

 if(!navigator.mediaDevices||!window.MediaRecorder){alert('المتصفح لا يدعم التسجيل. جرّب Chrome أو Safari حديثًا، أو استخدم «رفع تسجيل».');return}
 let stream;
 try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:true,autoGainControl:false,channelCount:1}})}
 catch(e){alert('لم يُسمح باستخدام المايكروفون. اسمح للموقع بالوصول إلى المايكروفون من إعدادات المتصفح ثم حاول مجددًا.');return}
 const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))||'';
 const mr=new MediaRecorder(stream,mime?{mimeType:mime,audioBitsPerSecond:64000}:undefined);
 const AC=window.AudioContext||window.webkitAudioContext,ac=new AC(),src=ac.createMediaStreamSource(stream),an=ac.createAnalyser();an.fftSize=1024;src.connect(an);
 const chunks=[];
 REC={stream,mr,ac,an,chunks,t0:Date.now(),acc:0,paused:false,meta,lv:[],quietSec:0};
 mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};

 try{REC.wake=await navigator.wakeLock.request('screen')}catch(e){}

function recElapsed(){if(!REC)return 0;return REC.acc+(REC.paused?0:(Date.now()-REC.t0)/1000)}
function renderRec(){
 $('#app').innerHTML=`<section class="card">
  <div class="rec-state" id="rs"><span class="rec-dot"></span>جارٍ التسجيل… تحدّث بشكل طبيعي</div>
  <div class="rec-timer" id="rt">0:00</div>
  <canvas class="viz" id="viz"></canvas>
  <div class="row center">
   <button class="btn ghost" id="bPause">إيقاف مؤقت</button>

  </div>
  <div class="row center" style="margin-top:10px"><button class="btn ghost small" id="bCancel" style="padding:5px 14px">إلغاء</button></div>
  <div class="hint" id="rh">ابدأ بافتتاح واضح، ونوّع نبرتك، واختم بخلاصة. الحد الأقصى ${toAr(MAX_MIN)} دقيقة.</div>
 </section>`;
 $('#bPause').onclick=()=>{if(!REC)return;if(REC.paused){REC.mr.resume();REC.t0=Date.now();REC.paused=false;$('#bPause').textContent='إيقاف مؤقت';$('#rs').innerHTML='<span class="rec-dot"></span>جارٍ التسجيل…'}else{REC.mr.pause();REC.acc+=(Date.now()-REC.t0)/1000;REC.paused=true;$('#bPause').textContent='استئناف';$('#rs').textContent='متوقف مؤقتًا'}};
 $('#bStop').onclick=()=>stopRec(true);
 $('#bCancel').onclick=()=>{if(confirm('إلغاء التسجيل الحالي؟'))stopRec(false)};
}
function loopViz(){
 if(!REC||view!=='rec')return;
 const cv=$('#viz');if(cv){
  const dpr=window.devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;if(cv.width!==W*dpr){cv.width=W*dpr;cv.height=H*dpr}
  const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,W,H);
  const d=new Float32Array(REC.an.fftSize);REC.an.getFloatTimeDomainData(d);let s=0;for(const v of d)s+=v*v;const rms=Math.sqrt(s/d.length);
  if(!REC.paused){REC.lv.push(rms);if(REC.lv.length>120)REC.lv.shift()}
  const n=60,bw=W/n,col=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#0B4D3A';
  for(let i=0;i<n;i++){const v=REC.lv[REC.lv.length-n+i]||0;const h=Math.max(3,Math.min(H,Math.sqrt(v)*H*2.6));x.fillStyle=col;x.globalAlpha=.35+.65*(i/n);const r=Math.min(bw*.35,4);x.beginPath();x.roundRect?x.roundRect(W-(i+1)*bw+bw*.2,(H-h)/2,bw*.6,h,r):x.rect(W-(i+1)*bw+bw*.2,(H-h)/2,bw*.6,h);x.fill()}
  x.globalAlpha=1;
  const el=recElapsed();$('#rt').textContent=fmtDur(el);
  // تنبيه إن كان الصوت منخفضًا جدًا
  const recent=REC.lv.slice(-60),mx=Math.max(0,...recent);
  const rh=$('#rh');if(rh&&el>4&&!REC.paused){if(mx<0.012)rh.textContent='🔈 الصوت منخفض جدًا — اقترب من المايكروفون أو ارفع صوتك.';else if(el>MAX_MIN*60-60)rh.textContent='⏳ اقتربت من الحد الأقصى ('+toAr(MAX_MIN)+' دقيقة).';}
  if(el>=MAX_MIN*60){stopRec(true);return}
 }
 requestAnimationFrame(loopViz);
}
function stopRec(go){
 const R=REC;if(!R)return;REC=null;
 const dur=R.acc+(R.paused?0:(Date.now()-R.t0)/1000);
 R.mr.onstop=()=>{R.stream.getTracks().forEach(t=>t.stop());try{R.ac.close()}catch(e){}try{R.wake&&R.wake.release()}catch(e){}
  if(!go){view='home';render();return}
  if(dur<MIN_SEC){alert('التسجيل قصير جدًا. تحدّث '+toAr(MIN_SEC)+' ثوانٍ على الأقل.');view='home';render();return}
  const blob=new Blob(R.chunks,{type:R.mr.mimeType||'audio/webm'});
  runJob(blob,R.meta,'تسجيل مباشر')};
 try{R.mr.stop()}catch(e){R.mr.onstop()}
}

async function makeSample(clip){
 const SR=16000,seg=4*60*SR,gap=new Float32Array(SR),n=clip.length,mid=Math.max(seg,Math.floor(n/2-seg/2));
 const parts=[clip.subarray(0,seg),gap,clip.subarray(mid,mid+seg),gap,clip.subarray(Math.max(mid+seg,n-seg),n)];
 const tot=parts.reduce((a,b)=>a+b.length,0),out=new Float32Array(tot);let o=0;for(const x of parts){out.set(x,o);o+=x.length}
 const mp3=await encodeMP3(out,32);job.b64=await blobToB64(mp3);job.sampled=true;job.sampleSpan=(tot-2*SR)/SR}

let STEPS=['قراءة الصوت وتجهيزه','تحليل النبرة والوقفات ومستوى الصوت','ضغط التسجيل وإرساله','الاستماع والتقييم بالذكاء الاصطناعي'];

async function runJob(blob,meta,srcName){
 job={meta,srcName};
 const isFile=blob instanceof File,vid=isFile&&isVideo(blob),big=blob.size>25*1024*1024;
 STEPS[0]=vid?'استخراج الصوت من الفيديو وتقليل حجمه':big?'تقليل حجم الملف وتجهيز الصوت':'قراءة الصوت وتجهيزه';
 PROC={step:0,prog:.02,err:'',note:isFile?'حجم الملف الأصلي: '+fmtMB(blob.size):''};view='proc';render();
 try{
  const base=PROC.note;
  const {pcm:raw,fullSec}=await loadAudio(blob,p=>setProg(.02+p*.13),m=>{if(m==='play'){PROC.note=base+' — جارٍ استخراج الصوت (قد يستغرق نصف مدة المقطع)';const pn=$('#pn');if(pn)pn.textContent=PROC.note}});
  let pcm=raw;
  const totalSec=pcm.length/16000;
  job.cut=fullSec>MAX_MIN*60+30;
  setStep(1,.15,(job.cut?`المقطع ${durWords(fullSec)}، وسيُقيَّم أول ${toAr(MAX_MIN)} دقيقة منه.`:'المدة: '+durWords(totalSec)));await new Promise(r=>setTimeout(r,30));
  const st=analyze(pcm);
  if(st.empty||st.speech<3)throw new Error('لم أسمع كلامًا واضحًا في التسجيل. تأكد من أن المايكروفون يعمل وأن الصوت مسموع.');
  if(st.span<MIN_SEC)throw new Error('الكلام قصير جدًا للتقييم. تحدّث '+toAr(MIN_SEC)+' ثوانٍ على الأقل.');
  job.st=st;
  setStep(2,.3,'');
  const clip=trimPCM(pcm,st);pcm=null;job.clip=st.span>900?clip:null;job.sampled=false;
  const kbps=st.span<=600?48:st.span<=1200?32:st.span<=2400?24:16;
  const mp3=await encodeMP3(clip,kbps,p=>setProg(.3+p*.3));
  job.b64=await blobToB64(mp3);job.mime='audio/mpeg';job.audioURL=URL.createObjectURL(mp3);
  if(isFile)job.sizeNote=`✓ قُلّص الحجم من ${fmtMB(blob.size)} إلى ${fmtMB(mp3.size)} (صوت فقط).`;
  await runAI();
 }catch(e){console.error(e);PROC.err=e.message||'حدث خطأ غير متوقع.';renderProc()}
}
let WAKE=null,HIDDEN=false;
document.addEventListener('visibilitychange',()=>{if(document.hidden&&view==='proc')HIDDEN=true;else if(!document.hidden&&view==='proc'&&!PROC.err)keepAwake()});
async function keepAwake(){try{if(!WAKE||WAKE.released)WAKE=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseAwake(){try{WAKE&&WAKE.release()}catch(e){}WAKE=null}
function aiErrMsg(m){
 if(/timeout|abort/i.test(m))return 'استغرق التقييم وقتًا أطول من المتوقع.';
 if(/quota|429|resource.?exhausted/i.test(m))return 'الخدمة مشغولة حاليًا. انتظر دقيقة ثم أعد المحاولة.';
 if(/too large|payload|413/i.test(m))return 'التسجيل كبير جدًا على خدمة التقييم. اقتطع جزءًا أقصر.';
 if(/app.?check|permission|403|401|unauthenticated/i.test(m))return 'تعذّر التحقق من الموقع لدى خدمة التقييم. أعد تحميل الصفحة ثم حاول مجددًا.';
 if(/fetch|network|Failed to load|import|load failed/i.test(m))return 'انقطع الاتصال بخدمة التقييم.';

async function runAI(){
 const st=job.st;PROC.err='';PROC.detail='';HIDDEN=false;keepAwake();
 const mins=st.span/60,est=Math.round(30+mins*5);
 const timeout=Math.min(900000,Math.max(240000,est*4000));
 const base=(job.sizeNote?job.sizeNote+'\n':'')+`يستمع الذكاء الاصطناعي للتسجيل كاملًا… قد يستغرق ذلك قرابة ${est<60?toAr(est)+' ثانية':toAr(Math.ceil(est/60))+' دقائق'}.\n📱 أبقِ الشاشة مفتوحة ولا تغادر الصفحة حتى يكتمل.`;
 setStep(3,.62,base);
 const t0=Date.now();let writing=0;
 const tick=setInterval(()=>{const p=writing?Math.min(.98,.85+.13*Math.min(1,writing/5000)):Math.min(.85,.62+.23*(1-Math.exp(-(Date.now()-t0)/1000/est)));setProg(p)},400);
 const onText=n=>{if(!writing){const pn=$('#pn');if(pn)pn.textContent=(job.sizeNote?job.sizeNote+'\n':'')+'✍️ انتهى الاستماع، ويكتب التقييم الآن…'}writing=Math.max(1,n)};
 try{
  let ai=null,lastM='';
  for(let attempt=1;attempt<=3&&!ai;attempt++){
   try{ai=await aiEvaluate(buildPrompt(job.meta,st),job.b64,job.mime,job.sampled?Math.min(timeout,420000):timeout,job.sampled?job.sampleSpan:st.span,onText)}
   catch(e){lastM=String(e&&(e.message||e.code)||e);console.warn('ai attempt',attempt,e);
    const transient=/timeout|abort|fetch|network|load failed|503|500|unavailable|overloaded|internal|JSON|Unexpected|Unterminated/i.test(lastM);
    const pn=()=>$('#pn');
    if(attempt===1&&transient){writing=0;if(pn())pn().textContent=base+'\n↻ تعثّر الاتصال، أعيد المحاولة تلقائيًا…';await new Promise(r=>setTimeout(r,2500));continue}
    if(attempt===2&&transient&&job.clip&&!job.sampled){writing=0;
     if(pn())pn().textContent='↻ التسجيل طويل جدًا على التقييم الكامل، سأقيّمه الآن من عيّنات: ٤ دقائق من البداية و٤ من الوسط و٤ من النهاية…';
     await makeSample(job.clip);continue}
    PROC.detail=lastM.slice(0,160);
    throw new Error(aiErrMsg(lastM)+(HIDDEN?' يبدو أن الشاشة أُغلقت أو انتقلت لتطبيق آخر أثناء التقييم؛ أبقِ الصفحة مفتوحة ثم اضغط «إعادة المحاولة».':' اضغط «إعادة المحاولة».'))}}
  clearInterval(tick);releaseAwake();
  if(!ai||ai.valid===false){PROC.err='لم يتمكن المقيّم من تقييم التسجيل: '+(aStr(ai&&ai.invalid_reason)||'لا يوجد كلام عربي واضح.');renderProc();return}
  const res=finalize(ai,st,job.meta,job.sampled?job.sampleSpan:st.span);res.cut=!!job.cut;res.sampled=!!job.sampled;job.clip=null;
  store.hist.unshift(res);store.hist=store.hist.slice(0,40);save();
  job.result=res;view='result';render();
 }catch(e){clearInterval(tick);releaseAwake();PROC.err=e.message;renderProc()}
}
function finalize(ai,st,meta,wspan){wspan=wspan||st.span;
 const c={};let total=0;
 for(const [k,,w] of CRIT){const o=(ai.criteria||{})[k]||{};let s=Number(o.score);if(!isFinite(s))s=0;
  if(s>w)s=s<=10?s/10*w:s/100*w; // إن أعطى النموذج الدرجة من 10 أو من 100
  s=clamp(Math.round(s*2)/2,0,w);c[k]={score:s,comment:aStr(o.comment)};total+=s}
 const wc=Number(ai.word_count)||0;
 return {id:Date.now(),at:new Date().toISOString(),meta,name:meta.name,st,total:Math.round(total),crit:c,
  wpm:wc&&wspan?Math.round(wc/(wspan/60)):0,
  ai:{speech_type:aStr(ai.speech_type),register:aStr(ai.register),topic:aStr(ai.topic),summary:aStr(ai.summary),transcript:aStr(ai.transcript),word_count:wc,verdict:aStr(ai.verdict),
   strengths:arr(ai.strengths).map(aStr).filter(Boolean),
   improvements:arr(ai.improvements).filter(x=>x&&typeof x==='object').map(x=>({point:aStr(x.point),example:aStr(x.example),suggestion:aStr(x.suggestion)})).filter(x=>x.point),
   language_notes:arr(ai.language_notes).filter(x=>x&&typeof x==='object').map(x=>({said:aStr(x.said),better:aStr(x.better),why:aStr(x.why)})).filter(x=>x.said||x.better),
   factual_notes:arr(ai.factual_notes).filter(x=>x&&typeof x==='object').map(x=>({claim:aStr(x.claim),note:aStr(x.note)})).filter(x=>x.note),
   fillers:arr(ai.fillers).filter(x=>x&&aStr(x.word)).map(x=>({word:aStr(x.word),count:Math.max(0,Math.round(Number(x.count)||0))})).sort((a,b)=>b.count-a.count).slice(0,8),
   best_quote:aStr(ai.best_quote),better_opening:aStr(ai.better_opening),better_closing:aStr(ai.better_closing),
   tips:arr(ai.tips).map(aStr).filter(Boolean)}}}

  ${job.audioURL&&!job.fromHist?`<audio controls src="${job.audioURL}" class="noprint"></audio>`:''}
 </section>
 ${a.topic||a.summary?`<section class="card"><h2>المضمون</h2>${a.topic?`<p style="margin:0 0 6px"><b>الموضوع:</b> ${esc(a.topic)}</p>`:''}${a.summary?`<p style="margin:0">${esc(a.summary)}</p>`:''}
  ${a.transcript?`<details class="tr" style="margin-top:10px"><summary>النص المفرّغ</summary><div class="trtext">${esc(a.transcript)}</div></details>`:''}</section>`:''}
 <section class="card"><h2>تفصيل الدرجة</h2>
  ${CRIT.map(([k,lab,w])=>{const o=r.crit[k],p=o.score/w;return `<div class="crit"><div class="crit-h"><span>${lab}</span><b style="color:${pctColor(p)}">${toAr(o.score)} / ${toAr(w)}</b></div><div class="bar"><i style="width:${p*100}%;background:${pctColor(p)}"></i></div>${o.comment?`<p>${esc(o.comment)}</p>`:''}</div>`}).join('')}
 </section>
 <section class="card"><h2>قياسات الصوت والإلقاء</h2>
  <div class="stats">
   ${r.wpm?`<div class="stat"><small>سرعة الكلام</small><b>${toAr(r.wpm)} <span class="small">كلمة/دقيقة</span></b>${wpmL}</div>`:''}
   ${st.pitchSt?`<div class="stat"><small>تنوّع نبرة الصوت</small><b>${toAr(st.pitchSt.toFixed(1))} <span class="small">نصف نغمة</span></b>${pitL}</div>`:''}
   <div class="stat"><small>تنويع ارتفاع الصوت</small><b>${toAr(st.loudStd.toFixed(1))} <span class="small">ديسبل</span></b>${ldL}</div>
   <div class="stat"><small>زمن الكلام الفعلي</small><b>${toAr(Math.round(st.speakRatio*100))}٪</b><em class="muted">والباقي وقفات</em></div>
   <div class="stat"><small>الوقفات الطويلة (+٢ ث)</small><b>${toAr(st.longPauses)}</b>${lpL}</div>
  </div>
  ${st.quiet?'<p class="small" style="color:var(--warn);margin:10px 0 0">⚠️ مستوى التسجيل منخفض؛ قد يقل ذلك من دقة تقييم النبرة.</p>':''}
 </section>
 ${a.best_quote?`<section class="card"><h2>أجمل ما قلت</h2><p class="quote">${esc(a.best_quote)}</p></section>`:''}
 ${a.strengths.length?`<section class="card"><h2>نقاط القوة</h2><ul class="list">${a.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>`:''}
 ${a.improvements.length?`<section class="card"><h2>ما يحتاج إلى تطوير</h2>${a.improvements.map(x=>`<div class="imp"><b>${esc(x.point)}</b>${x.example?`<div class="ex">قلت: «${esc(x.example)}»</div>`:''}${x.suggestion?`<div class="sg">✦ ${esc(x.suggestion)}</div>`:''}</div>`).join('')}</section>`:''}
 ${a.fillers.length?`<section class="card"><h2>كلمات الحشو والتكرار</h2><div>${a.fillers.map(f=>`<span class="fill">«${esc(f.word)}»${f.count?` × ${toAr(f.count)}`:''}</span>`).join('')}</div></section>`:''}
 ${a.language_notes.length?`<section class="card"><h2>ملاحظات لغوية</h2><table class="ln"><thead><tr><th>قلت</th><th>الأفضل</th><th>السبب</th></tr></thead><tbody>${a.language_notes.map(n=>`<tr><td class="said">${esc(n.said)}</td><td class="better">${esc(n.better)}</td><td class="muted">${esc(n.why)}</td></tr>`).join('')}</tbody></table></section>`:''}
 ${a.factual_notes.length?`<section class="card"><h2>ملاحظات على صحة المعلومات</h2>${a.factual_notes.map(n=>`<div class="imp" style="border-color:var(--bad)">${n.claim?`<div class="ex">«${esc(n.claim)}»</div>`:''}<div class="sg">${esc(n.note)}</div></div>`).join('')}</section>`:''}
 ${a.better_opening||a.better_closing?`<section class="card"><h2>صياغة مقترحة</h2>${a.better_opening?`<h3>افتتاح أقوى</h3><p class="quote" style="margin-bottom:12px">${esc(a.better_opening)}</p>`:''}${a.better_closing?`<h3>ختام أقوى</h3><p class="quote">${esc(a.better_closing)}</p>`:''}</section>`:''}
 ${a.tips.length?`<section class="card"><h2>تمارين للمرة القادمة</h2><ul class="list">${a.tips.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section>`:''}
 <div class="row center noprint" style="margin:6px 0 4px">
  <button class="btn" id="bNew">${ICON.mic.replace('<svg','<svg width="20" height="20"')}تقييم جديد</button>
  <button class="btn ghost" id="bPrint">طباعة / حفظ PDF</button>
  <button class="btn ghost" id="bShare">مشاركة النتيجة</button>
 </div>
 <p class="muted small" style="text-align:center">التقييم آلي بالذكاء الاصطناعي للاسترشاد والتدريب، وقد يختلف قليلًا بين محاولة وأخرى.</p>`;
 requestAnimationFrame(()=>{setTimeout(()=>{const g=$('#garc');if(g)g.style.strokeDashoffset=off;
  const t0=performance.now(),gn=$('#gnum');(function an(t){const p=Math.min(1,(t-t0)/1200);gn.textContent=toAr(Math.round(r.total*(1-Math.pow(1-p,3))));if(p<1)requestAnimationFrame(an)})(t0)},60)});
 $('#bNew').onclick=()=>{view='home';render()};
 $('#bPrint').onclick=()=>{document.querySelectorAll('details.tr').forEach(d=>d.open=true);window.print()};
 $('#bShare').onclick=async()=>{
  const txt=`🎤 نتيجتي في «بيان» لتقييم الإلقاء: ${r.total}/100 (${lv})\n`+CRIT.map(([k,l,w])=>`• ${l}: ${r.crit[k].score}/${w}`).join('\n')+`\n${location.href}`;
  try{if(navigator.share){await navigator.share({title:'نتيجة بيان',text:txt});return}}catch(e){return}
  try{await navigator.clipboard.writeText(txt);alert('نُسخت النتيجة، يمكنك لصقها في أي محادثة.')}catch(e){prompt('انسخ النتيجة:',txt)}};
}

/* =================== تشغيل =================== */
window.addEventListener('beforeunload',e=>{if(REC||view==='proc'&&!PROC.err){e.preventDefault();e.returnValue=''}});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
</body>
</html>
